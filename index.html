D.self.wub = [
{ t: 'Berufsausbildung', pts: 3, q: 'Das duale System hat zwei Lernorte. Nenne sie und je zwei Merkmale (Grundlage, Aufsicht).',
  m: '<b>Betrieb:</b> Ausbildung nach der Ausbildungsordnung und dem betrieblichen Ausbildungsplan, Berufsausbildungsvertrag, Ausbildungsnachweis, Aufsicht durch die <b>IHK</b>. <b>Berufsschule:</b> Unterricht nach dem Rahmenlehrplan in Lernfeldern (schulisches Curriculum), Aufsicht durch Schulleitung bzw. obere Schulaufsichtsbehörde. Rechtsgrundlage ist das <b>BBiG</b>. <i>1 P. Lernorte, je 1 P. Merkmale (max. 3).</i>' },
{ t: 'Berufsausbildung', pts: 5, q: 'Nenne je drei Pflichten des Ausbildenden und des Auszubildenden nach dem BBiG und gib bei zweien den Paragrafen an.',
  m: '<b>Ausbildender (§ 14):</b> Ausbildung planmäßig vermitteln, Ausbildungsmittel kostenfrei stellen, für Berufsschule und Prüfungen freistellen, Ausbildungsnachweis kontrollieren, nur ausbildungsbezogene Aufgaben übertragen; Vergütung (§ 17), Zeugnis (§ 16). <b>Auszubildender (§ 13):</b> Lernpflicht, Weisungen folgen, Ordnung einhalten, Geheimhaltung, Ausbildungsnachweis führen, Ausbildungsmittel pfleglich behandeln, bei Fehlen unverzüglich Bescheid geben. <i>Je 1 P. pro richtiger Pflicht (6 genannt, max. 5), Paragrafen zählen mit.</i>' },
{ t: 'Berufsausbildung', pts: 3, q: 'Nenne sechs Mindestinhalte eines Berufsausbildungsvertrags und nenne die gesetzliche Grundlage.',
  m: 'Grundlage: <b>§ 11 BBiG</b>. Mindestinhalte, z. B.: Art, sachliche und zeitliche Gliederung und Ziel · Beginn und Dauer · Maßnahmen außerhalb der Ausbildungsstätte · tägliche Ausbildungszeit · <b>Probezeit</b> · Zahlung und Höhe der Vergütung · Urlaub · Kündigungsvoraussetzungen · Hinweise auf Tarifverträge/Betriebsvereinbarungen · Form des Ausbildungsnachweises. <i>1 P. Grundlage, je 1 P. für 2 Inhalte (max. 3).</i>' },
{ t: 'Berufsausbildung', pts: 4, q: 'Erkläre die Probezeit im Ausbildungsverhältnis: Dauer, Kündigung in der Probezeit und Kündigung nach der Probezeit.',
  m: '<b>Dauer:</b> mindestens 1, höchstens 4 Monate (§ 20 BBiG). <b>In der Probezeit:</b> von beiden Seiten jederzeit <b>ohne Kündigungsfrist</b> und ohne Grund, schriftlich (§ 22 Abs. 1). <b>Nach der Probezeit:</b> der Betrieb nur <b>fristlos aus wichtigem Grund</b> (binnen 2 Wochen ab Kenntnis), der Azubi mit <b>4 Wochen</b> Frist, wenn er die Ausbildung aufgibt oder den Beruf wechselt; schriftlich mit Angabe der Gründe (§ 22 Abs. 2 und 3). <i>1 P. Dauer, 1 P. Probezeit, 2 P. danach.</i>' },
{ t: 'Berufsausbildung', pts: 4, q: 'Eine 17-jährige Auszubildende arbeitet 8 Stunden täglich. Welche Pause steht ihr zu, wie viele Urlaubstage hat sie, und wie viele Stunden Freizeit muss zwischen zwei Arbeitstagen liegen?',
  m: 'Nach dem <b>Jugendarbeitsschutzgesetz</b>: Pause <b>60 Minuten</b> (bei mehr als 6 Stunden), <b>25 Urlaubstage</b> (unter 18 Jahren), mindestens <b>12 Stunden Freizeit</b> nach der Arbeit. Außerdem: 40-Stunden-Woche, 5-Tage-Woche, Arbeit nur zwischen 6 und 20 Uhr. <i>Je 1 P., 1 P. für die Nennung des Gesetzes oder weitere Regeln.</i>' },
{ t: 'Berufsausbildung', pts: 5, q: 'Notiere die wichtigsten Aspekte des Arbeitszeitgesetzes: werktägliche Arbeitszeit, maximale tägliche Arbeitszeit, Pause bei 8,5 Stunden, Mindest-Ruhezeit, Sonntagsarbeit.',
  m: 'Werktägliche Arbeitszeit <b>8 Stunden</b> · maximal <b>10 Stunden</b> täglich (bis 60 Std./Woche), wenn innerhalb von 6 Monaten im Schnitt 8 Stunden nicht überschritten werden · Pause bei 8,5 Stunden mindestens <b>30 Minuten</b> (mehr als 6 bis 9 Std.) · Mindest-Ruhezeit <b>11 Stunden</b> · Sonntagsarbeit grundsätzlich <b>verboten</b> (Ausnahmen z. B. Krankenhaus, Gastronomie). <i>Je 1 P.</i>' },
{ t: 'Kündigung', pts: 5, q: 'Fallaufgabe: Frau K. arbeitet seit 3 Jahren in einem Betrieb mit 40 Beschäftigten. Am 28.10. erhält sie per WhatsApp die Nachricht: „Du bist entlassen, weil du dreimal zu spät gekommen bist.“ Beurteile, ob die Kündigung wirksam ist (mit gesetzlicher Grundlage).',
  m: '<b>Unwirksam.</b> (1) <b>Form:</b> Kündigung braucht Schriftform, die elektronische Form ist ausgeschlossen (<b>§ 623 BGB</b>), WhatsApp genügt nicht. (2) Das <b>KSchG gilt</b> (länger als 6 Monate, mehr als 10 Beschäftigte, § 1 KSchG). Die Kündigung wäre <b>verhaltensbedingt</b> und müsste sozial gerechtfertigt sein. (3) Bei verhaltensbedingter Kündigung ist in der Regel eine <b>vorherige Abmahnung</b> nötig, die fehlt. (4) Falls ein Betriebsrat besteht, muss er angehört werden (<b>§ 102 BetrVG</b>). (5) Frist nach § 622 BGB (3 Jahre: 1 Monat zum Monatsende bei Kündigung durch den Arbeitgeber). <i>1 P. je genannter Punkt, max. 5.</i>' },
{ t: 'Kündigung', pts: 3, q: 'Unterscheide ordentliche und außerordentliche Kündigung. Nenne je ein Merkmal und die Rechtsgrundlage der außerordentlichen Kündigung.',
  m: '<b>Ordentliche Kündigung:</b> mit gesetzlicher oder vertraglicher Kündigungsfrist (§ 622 BGB), bei Geltung des KSchG nur bei sozialer Rechtfertigung. <b>Außerordentliche (fristlose) Kündigung:</b> <b>§ 626 BGB</b>, ohne Frist, nur aus <b>wichtigem Grund</b> (Fortsetzung unzumutbar, z. B. Diebstahl, Tätlichkeit), innerhalb von <b>2 Wochen</b> nach Kenntnis der Tatsachen. <i>1 P. ordentlich, 1 P. außerordentlich, 1 P. Rechtsgrundlage/Frist.</i>' },
{ t: 'Kündigung', pts: 3, q: 'Nenne die drei Gruppen von Kündigungsgründen nach § 1 Abs. 2 KSchG, gib je ein Beispiel und nenne die jeweilige Voraussetzung.',
  m: '<b>Personenbedingt</b> (z. B. lang andauernde Krankheit mit negativer Prognose) · <b>verhaltensbedingt</b> (z. B. wiederholtes Zuspätkommen; Voraussetzung: <b>Abmahnung</b>) · <b>betriebsbedingt</b> (z. B. Wegfall des Arbeitsplatzes durch Umsatzrückgang; Voraussetzung: <b>Sozialauswahl</b>). <i>Je 1 P. pro Gruppe mit Beispiel.</i>' },
{ t: 'Kündigung', pts: 6, q: 'Verfasse eine Abmahnung an Sarah Klein (Pers.-Nr. 345, Schulweg 9, 70771 Leinfelden-Echterdingen). Vereinbarter Arbeitsbeginn 07:00 Uhr ohne Gleitzeit. Laut Zeiterfassung begann sie am Di 2. Juni um 07:20, am Mi 3. Juni um 08:15 und am Mi 10. Juni um 07:30 Uhr.',
  m: '<b>Muss enthalten:</b> Betreff „Abmahnung“, Empfängerin mit Anschrift, Datum, Absender · <b>genaue Beschreibung</b> der drei Verspätungen mit Datum, Uhrzeit und Dauer (20 Min., 1 Std. 15 Min., 30 Min.) · die verletzte Pflicht (Arbeitsbeginn 07:00 Uhr) · <b>Rüge</b> und <b>Aufforderung</b>, künftig pünktlich zu sein · <b>Androhung</b> arbeitsrechtlicher Konsequenzen bis zur Kündigung bei Wiederholung · Hinweis auf <b>Personalakte</b> und Möglichkeit zur Stellungnahme · Unterschrift. Sachlich, ohne Beleidigungen, ohne die pünktlichen oder zu frühen Tage zu erwähnen. <i>Je 1 P. für: Form/Adressat, genaue Daten, verletzte Pflicht, Rüge/Aufforderung, Androhung, Personalakte/Unterschrift.</i>' },
{ t: 'Kündigung', pts: 4, q: 'Funktionen und Bestandteile einer Abmahnung: Nenne die drei Funktionen und vier Bestandteile.',
  m: '<b>Funktionen:</b> Rüge-, Dokumentations- (Hinweis-) und Warnfunktion. <b>Bestandteile:</b> genaue Beschreibung des Fehlverhaltens (Datum, Uhrzeit), verletzte Pflicht, Aufforderung zu vertragsgemäßem Verhalten, Androhung von Konsequenzen bis zur Kündigung, Aufnahme in die Personalakte, Unterschrift. <i>2 P. Funktionen, 2 P. Bestandteile.</i>' },
{ t: 'Kündigung', pts: 6, q: 'Sozialauswahl: Führe sie mit dem Punkteschema (Alter 1 P. je Jahr, max. 55 · Betriebszugehörigkeit bis 10 Jahre 1 P., danach 2 P. je Jahr, max. 70, nur bis zum 55. Lebensjahr · Kind 4 P. · verheiratet 8 P.) für diese Personen durch: A) 40 Jahre, 12 Jahre im Betrieb, verheiratet, 1 Kind · B) 29 Jahre, 3 Jahre im Betrieb, ledig, keine Kinder · C) 52 Jahre, 20 Jahre im Betrieb, verheiratet, 2 Kinder. Wem wird gekündigt?',
  m: '<b>A:</b> 40 + (10 + 2 · 2 = 14) + (8 + 4 = 12) = <b>66</b> · <b>B:</b> 29 + 3 + 0 = <b>32</b> · <b>C:</b> 52 + (10 + 2 · 10 = 30) + (8 + 8 = 16) = <b>98</b>. Gekündigt wird <b>B</b> mit der niedrigsten Punktzahl (32). <i>1 P. je richtig berechnete Person, 1 P. Ergebnis, 1 P. Begründung (am wenigsten schutzbedürftig, § 1 Abs. 3 KSchG).</i>' },
{ t: 'Kündigung', pts: 3, q: 'Eva T. (43 Jahre, verheiratet, 3 Kinder, 8 Jahre im Betrieb, zweimal über 8 Wochen krank, keine Besserung in Sicht) soll gekündigt werden. Welcher Kündigungsgrund liegt vor, gilt das KSchG, welche Frist gilt?',
  m: 'Grund: <b>personenbedingt</b> (Krankheit, § 1 Abs. 2 KSchG). Das KSchG ist <b>anwendbar</b> (8 Jahre, über 6 Monate). Kündigung möglich bei negativer Gesundheitsprognose und erheblicher Betriebsbelastung nach Interessenabwägung (BEM prüfen). Frist bei Kündigung durch den Arbeitgeber: <b>3 Monate zum Monatsende</b> (ab 8 Jahren). Schriftform und Betriebsrat nötig. <i>Je 1 P.: Grund, KSchG, Frist.</i>' },
{ t: 'Kündigung', pts: 3, q: 'Mehmet A. (59 Jahre, 28 Jahre im Betrieb, zufriedenstellende Leistungen, Probleme mit der Digitalisierung) soll gekündigt werden. Beurteile die Kündigung.',
  m: 'KSchG <b>anwendbar</b>. Mögliche Einordnung <b>personenbedingt</b> (Fähigkeiten), keine Pflichtverletzung, also nicht verhaltensbedingt. <b>Eher nicht gerechtfertigt</b>: Leistungen zufriedenstellend, mildere Mittel (<b>Schulung/Weiterbildung</b>) nicht ausgeschöpft, sehr lange Betriebszugehörigkeit und hohes Alter. Wäre sie doch möglich, gilt die Frist von <b>7 Monaten</b> zum Monatsende. <i>1 P. Grund/KSchG, 1 P. Beurteilung, 1 P. Begründung.</i>' },
{ t: 'Kündigung', pts: 3, q: 'Büsra P. (22 Jahre, alleinerziehend, 5 Monate im Betrieb als Sekretärin, sehr gute Leistungen) wird gekündigt. Ist die Kündigung möglich? Begründe mit dem KSchG.',
  m: 'Das <b>KSchG gilt nicht</b>, weil das Arbeitsverhältnis noch nicht länger als <b>6 Monate</b> besteht (§ 1 KSchG). Die Kündigung braucht <b>keinen Kündigungsgrund</b> und ist rechtlich <b>möglich</b>, wenn <b>Schriftform</b>, <b>Frist</b> (in der Probezeit 2 Wochen) und ggf. <b>Betriebsrat</b> eingehalten sind. Grenzen: Sonderkündigungsschutz (hier nicht, sie ist nicht schwanger) und Diskriminierungsverbot (AGG). <i>1 P. KSchG nicht anwendbar, 1 P. kein Grund nötig, 1 P. Form/Frist/Betriebsrat.</i>' },
{ t: 'Kündigung', pts: 3, q: 'Marcel S. (30 Jahre, 7 Jahre Chemielaborant, bereits eine Abmahnung wegen Nichteinhaltung von Arbeitsschutzmaßnahmen). Unter welcher Bedingung ist eine Kündigung gerechtfertigt, und welche Frist gilt?',
  m: 'Grund <b>verhaltensbedingt</b>. Gerechtfertigt, wenn er <b>erneut</b> in gleicher Weise gegen den Arbeitsschutz verstößt (die einschlägige <b>Abmahnung</b> liegt vor; Arbeitsschutz ist besonders gewichtig). Wegen der alten Sache allein nicht. Frist bei Kündigung durch den Arbeitgeber: <b>2 Monate zum Monatsende</b> (ab 5 Jahren). <i>1 P. Grund, 1 P. Bedingung, 1 P. Frist.</i>' },
{ t: 'Kündigung', pts: 3, q: 'Chiara ist im dritten Monat ihrer Probezeit zwei Wochen krank. Ihr Chef meint, dass sich die Probezeit nun um zwei Wochen verlängert. Stimmt das? Begründe.',
  m: '<b>Nein.</b> Die Probezeit endet mit der vereinbarten Dauer (höchstens 6 Monate, <b>§ 622 Abs. 3 BGB</b>); Krankheit verlängert sie nicht automatisch. Eine Verlängerung geht nur <b>im Einvernehmen</b> und insgesamt bis höchstens 6 Monate. Zusatz: Bei <b>Auszubildenden</b> verlängert sich die Probezeit nur, wenn die Unterbrechung mehr als <b>ein Drittel</b> der Probezeit beträgt (<b>§ 20 BBiG</b>). <i>1 P. Nein, 1 P. Begründung, 1 P. Rechtsgrundlage.</i>' },
{ t: 'Kündigung', pts: 3, q: 'Ein neuer Mitarbeiter erhält für die einmonatige Probezeit nur dann eine Vergütung, wenn ein endgültiger Arbeitsvertrag geschlossen wird. Ist das rechtens? Begründe.',
  m: '<b>Nein.</b> Die Probezeit ist <b>Teil des Arbeitsverhältnisses</b>, für geleistete Arbeit besteht ein <b>Anspruch auf Vergütung</b> (§ 611a BGB), mindestens in Höhe des <b>Mindestlohns</b> (MiLoG). Die Vereinbarung ist unwirksam. <i>1 P. Nein, 1 P. Teil des Arbeitsverhältnisses, 1 P. Vergütungsanspruch/Rechtsgrundlage.</i>' },
{ t: 'Arbeitsgericht', pts: 3, q: 'Beschreibe den Instanzenzug der Arbeitsgerichtsbarkeit mit der Besetzung der Gerichte.',
  m: '<b>1. Instanz Arbeitsgericht</b> (Kammer: 1 Berufsrichter + je 1 ehrenamtlicher Richter Arbeitgeber-/Arbeitnehmerseite) → <b>Berufung/Beschwerde</b> → <b>2. Instanz Landesarbeitsgericht</b> (Kammer, wie oben) → <b>Revision/Rechtsbeschwerde</b> → <b>3. Instanz Bundesarbeitsgericht</b> (Senat: 3 Berufsrichter + 2 ehrenamtliche Richter). <i>1 P. Reihenfolge, 1 P. Rechtsmittel, 1 P. Besetzung.</i>' },
{ t: 'Arbeitsgericht', pts: 4, q: 'Beschreibe den Ablauf eines Verfahrens in der ersten Instanz (Urteilsverfahren) und nenne die Bedingungen für die Berufung.',
  m: 'Wenige Wochen nach der Klage <b>Güteverhandlung</b> (nur Berufsrichter, Ziel gütliche Einigung und Beschleunigung). Scheitert sie: <b>Kammerverhandlung</b> mit den ehrenamtlichen Richtern (gleiches Stimmrecht), Urteil. <b>Berufung</b> zum LAG: wenn zugelassen, bei Beschwer über <b>600 €</b> oder bei Streit über Bestehen/Nichtbestehen/<b>Kündigung</b> eines Arbeitsverhältnisses. <i>2 P. Ablauf, 2 P. Berufung.</i>' },
{ t: 'Arbeitsgericht', pts: 3, q: 'Unterscheide Urteils- und Beschlussverfahren und nenne ein Beispiel für das Beschlussverfahren.',
  m: '<b>Urteilsverfahren:</b> Parteien tragen die Tatsachen selbst vor und beweisen sie (Ansprüche aus Arbeitsverhältnis, z. B. Kündigungsschutzklage). <b>Beschlussverfahren:</b> Gericht <b>ermittelt von Amts wegen</b> (Amtsermittlung), z. B. Streit um Mitbestimmung nach dem <b>Betriebsverfassungsgesetz</b>. <i>Je 1 P.</i>' },
{ t: 'Entgelt', pts: 5, q: 'Nenne die fünf Entgeltformen und je ein Beispiel.',
  m: '<b>Zeitentgelt</b> (Stundenlohn, Monatsgehalt) · <b>Leistungsentgelt</b> (Akkordlohn, Provision, Prämie) · <b>Zulagen</b> (Nacht-, Sonntagszulage, Funktionszulage) · <b>Beteiligungen</b> (Gewinnbeteiligung, Aktienoptionen) · <b>Zusatzleistungen</b> (vermögenswirksame Leistungen, Firmenwagen, betriebliche Altersvorsorge). <i>Je 1 P.</i>' },
{ t: 'Entgelt', pts: 3, q: 'Teilzeitausbildung nach § 8 BBiG: Wer kann sie beantragen, wie viele Wochenstunden sind möglich und wo wird der Antrag gestellt?',
  m: 'Mit Begründung, v. a. <b>Alleinerziehende und junge Eltern</b> sowie Azubis, die in der Familie einen Pflegefall betreuen. <b>20 bis 30 Wochenstunden</b> (Schule und Betrieb zusammen). Antrag <b>gemeinsam mit dem Ausbildenden bei der IHK</b>. Hilfen: Berufsausbildungsbeihilfe, Kindergeld. <i>Je 1 P.</i>' },
{ t: 'Abrechnung', pts: 4, q: 'Beschreibe die fünf Schritte zur Erstellung einer Gehaltsabrechnung und nenne zwei gesetzliche Vorgaben dazu.',
  m: '1. Bruttogehalt notieren · 2. Steuern und Sozialversicherungsbeiträge berechnen · 3. Nettogehalt ermitteln · 4. weitere Abzüge und Zuschüsse berechnen · 5. Auszahlungsbetrag ermitteln. Vorgaben: Abrechnung monatlich und korrekt nach <b>§ 108 GewO</b>, Aufbewahrung <b>6 Jahre</b> (<b>§ 41 EStG</b>). <i>3 P. Schritte, 1 P. Vorgaben.</i>' },
{ t: 'Abrechnung', pts: 4, q: 'Erkläre den Unterschied zwischen Brutto gesamt, gesetzlichem Netto und Auszahlungsbetrag und nenne die Rolle der vermögenswirksamen Leistungen.',
  m: '<b>Brutto gesamt</b> = Gehalt + Arbeitgeberzuschuss zur VL. <b>Gesetzliches Netto</b> = Brutto gesamt − Lohnsteuer, Soli, Kirchensteuer − Sozialversicherungsbeiträge (Arbeitnehmeranteil). <b>Auszahlungsbetrag</b> = gesetzliches Netto − Überweisung der VL (und weitere Abzüge). Die VL müssen in gesetzlich festgelegte Anlagen fließen (z. B. Bausparvertrag) und werden vom Arbeitgeber direkt überwiesen, deshalb vom Netto abgezogen. <i>Je 1 P. pro Begriff, 1 P. VL.</i>' },
{ t: 'Abrechnung', pts: 3, q: 'Ordne die Steuerklassen 1 bis 6 den Lebenssituationen zu.',
  m: '<b>1</b> ledig · <b>2</b> alleinerziehend · <b>3</b> verheiratet mit höherem Gehalt als der Partner · <b>4</b> verheiratet mit ähnlichem Gehalt · <b>5</b> verheiratet mit niedrigerem Gehalt (Partner Klasse 3) · <b>6</b> Neben- und Zweitjobs (kein Minijob). <i>Je 1 P. für 2 richtig zugeordnete Klassen.</i>' },
{ t: 'Abrechnung', pts: 3, q: 'Nenne die Abzüge von der Ausbildungsvergütung und sage, wer jeweils trägt (Arbeitnehmer, Arbeitgeber, beide).',

D.lern.wub.push({ id: 'zs1', title: 'Zusatz A · Steuererklärung (nicht in euren Unterlagen)', html: "<div class=\"warn\"><b>Zusatz A:</b> Dieses Thema steht auf eurer Moodle-Themenliste, aber <b>nicht in den hochgeladenen Unterlagen</b>. Ich habe es aus dem geltenden Recht aufgebaut (Zahlen Stand 2026, online geprüft). Wenn es in der Klausur nicht dran kommt, kannst du es auslassen. Im Probetest wird es nicht abgefragt, die Karten und Quizfragen sind mit „Zusatz“ markiert.</div><h4>Steuererklärung</h4>\n<p>Die Lohnsteuer ist nur eine <b>Vorauszahlung</b>. In der <b>Einkommensteuererklärung</b> (Anlage N für Arbeitnehmer, meist über ELSTER) wird das Jahr (Kalenderjahr) endgültig abgerechnet. Danach gibt es eine <b>Erstattung</b> oder eine <b>Nachzahlung</b>.</p>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Schritt</th><th>Inhalt</th></tr></thead><tbody>\n<tr><td>1. Einkünfte</td><td>7 Einkunftsarten: Land- und Forstwirtschaft, Gewerbebetrieb, selbständige Arbeit, <b>nichtselbständige Arbeit</b>, Kapitalvermögen, Vermietung und Verpachtung, sonstige Einkünfte. Von den Einnahmen werden die <b>Werbungskosten</b> abgezogen.</td></tr>\n<tr><td>2. Abzüge</td><td><b>Sonderausgaben</b> (z. B. Beiträge zu Kranken-, Pflege- und Rentenversicherung, Kirchensteuer, Spenden) und <b>außergewöhnliche Belastungen</b> (z. B. Krankheitskosten über der zumutbaren Eigenbelastung), Freibeträge</td></tr>\n<tr><td>3. Ergebnis</td><td>= <b>zu versteuerndes Einkommen</b> → Steuer nach dem Tarif (bis zum <b>Grundfreibetrag von 12.348 €</b> im Jahr 2026 steuerfrei; 2025: 12.096 €) − bereits gezahlte Lohnsteuer = Erstattung oder Nachzahlung</td></tr></tbody></table></div>\n<p><b>Werbungskosten</b> sind Ausgaben für den Beruf: Fahrten zur Arbeit, Arbeitsmittel, Fortbildung, Bewerbungskosten, Gewerkschaftsbeitrag. Das Finanzamt setzt automatisch den <b>Arbeitnehmer-Pauschbetrag von 1.230 €</b> an. Nur wer <b>mehr</b> nachweist, bekommt die tatsächlichen Kosten.<br>\n<b>Entfernungspauschale seit 2026: 0,38 € je Kilometer der einfachen Strecke, ab dem ersten Kilometer.</b> Beispiel: 15 km · 220 Tage · 0,38 € = 1.254 €. (2025 galten noch 0,30 € für die ersten 20 km.)</p>\n<p><b>Fristen:</b> Wer zur Abgabe verpflichtet ist und die Erklärung selbst macht, muss bis zum <b>31. Juli des Folgejahres</b> abgeben (Steuerjahr 2025: 31.7.2026). Mit Steuerberater oder Lohnsteuerhilfeverein gilt eine längere Frist (Steuerjahr 2025: 28.2.2027). Wer nicht verpflichtet ist, kann freiwillig abgeben (Antragsveranlagung, bis zu 4 Jahre rückwirkend).<br>\n<b>Pflicht</b> besteht z. B. bei Steuerklasse III/V (bzw. IV mit Faktor), bei Nebeneinkünften über 410 € oder bei Lohnersatzleistungen (z. B. Arbeitslosengeld I, Elterngeld) über 410 €. Gegen den <b>Steuerbescheid</b> kann man innerhalb von <b>1 Monat</b> nach Bekanntgabe <b>Einspruch</b> einlegen.</p>" });
D.lern.wub.push({ id: 'zs2', title: 'Zusatz B · Soziale Sicherung (nicht in euren Unterlagen)', html: "<div class=\"warn\"><b>Zusatz B:</b> Dieses Thema steht auf eurer Moodle-Themenliste, aber <b>nicht in den hochgeladenen Unterlagen</b>. Ich habe es aus dem geltenden Recht aufgebaut (Zahlen Stand 2026, online geprüft). Wenn es in der Klausur nicht dran kommt, kannst du es auslassen. Im Probetest wird es nicht abgefragt, die Karten und Quizfragen sind mit „Zusatz“ markiert.</div>\n<div class=\"box\"><b>Sozialstaatsprinzip</b> (Art. 20 GG): Der Staat sichert die Bürger gegen die großen Lebensrisiken ab. Das deutsche System beruht auf drei Prinzipien der Sicherung: <b>Versicherung</b>, <b>Versorgung</b> und <b>Fürsorge</b>.</div>\n\n<h4>Die fünf Zweige der Sozialversicherung</h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Zweig</th><th>Risiko</th><th>Träger</th><th>Leistungen (Auswahl)</th></tr></thead><tbody>\n<tr><td><b>Krankenversicherung</b></td><td>Krankheit</td><td>Krankenkassen</td><td>Behandlung, Medikamente, <b>Krankengeld</b> ab der 7. Woche (70 % des Brutto, höchstens 90 % des Netto); davor zahlt der AG <b>6 Wochen den Lohn fort</b></td></tr>\n<tr><td><b>Pflegeversicherung</b></td><td>Pflegebedürftigkeit</td><td>Pflegekassen (bei den Krankenkassen)</td><td>Pflegegrade 1 bis 5, Pflegegeld, Sachleistungen</td></tr>\n<tr><td><b>Rentenversicherung</b></td><td>Alter, Erwerbsminderung, Tod</td><td>Deutsche Rentenversicherung</td><td>Altersrente (Regelaltersgrenze schrittweise 67), Erwerbsminderungsrente, Hinterbliebenenrente, Reha</td></tr>\n<tr><td><b>Arbeitslosenversicherung</b></td><td>Arbeitslosigkeit</td><td>Bundesagentur für Arbeit</td><td><b>Arbeitslosengeld I</b>: 60 % des Netto (mit Kind 67 %), Vermittlung, Weiterbildung</td></tr>\n<tr><td><b>Unfallversicherung</b></td><td>Arbeitsunfall, Wegeunfall, Berufskrankheit</td><td>Berufsgenossenschaften, Unfallkassen</td><td>Heilbehandlung, Verletztengeld, Unfallrente. <b>Beitrag zahlt nur der Arbeitgeber.</b></td></tr></tbody></table></div>\n<p class=\"muted\">Reihenfolge der Entstehung: Kranken- (1883), Unfall- (1884), Renten- (1889), Arbeitslosen- (1927), Pflegeversicherung (1995). Beiträge zahlen Arbeitnehmer und Arbeitgeber je zur Hälfte (Ausnahmen: Unfallversicherung, Kinderlosenzuschlag, Zusatzbeitrag).</p>\n\n<h4>Prinzipien der Sozialversicherung</h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Prinzip</th><th>Bedeutung</th></tr></thead><tbody>\n<tr><td><b>Solidarprinzip</b></td><td>Die Gemeinschaft trägt das Risiko des Einzelnen. Beitrag nach Einkommen, Leistung nach Bedarf (typisch in der Krankenversicherung: Gesunde zahlen für Kranke, Gutverdiener für Geringverdiener).</td></tr>\n<tr><td><b>Äquivalenzprinzip</b></td><td>Leistung richtet sich nach der Beitragshöhe und -dauer (typisch in der Rentenversicherung: wer mehr und länger einzahlt, bekommt mehr Rente).</td></tr>\n<tr><td><b>Umlageverfahren / Generationenvertrag</b></td><td>Die Beiträge der heute Erwerbstätigen finanzieren die Renten der heutigen Rentner. Es wird kein Kapitalstock angespart. Problem: demografischer Wandel (mehr Rentner je Beitragszahler).</td></tr>\n<tr><td><b>Pflichtversicherung</b></td><td>Arbeitnehmer sind bis zur Versicherungspflichtgrenze (Krankenversicherung) kraft Gesetz versichert.</td></tr>\n<tr><td><b>Selbstverwaltung</b></td><td>Die Träger verwalten sich selbst (Vertreter der Versicherten und Arbeitgeber), unter staatlicher Rechtsaufsicht.</td></tr>\n<tr><td><b>Subsidiarität</b></td><td>Erst Eigenverantwortung und Familie, dann die Gemeinschaft, zuletzt der Staat.</td></tr></tbody></table></div>\n\n<h4>Versicherung · Versorgung · Fürsorge</h4>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Prinzip</th><th>Voraussetzung</th><th>Finanzierung</th><th>Beispiel</th></tr></thead><tbody>\n<tr><td><b>Versicherung</b></td><td>Beitragszahlung, Pflichtmitgliedschaft</td><td>Beiträge</td><td>Sozialversicherung</td></tr>\n<tr><td><b>Versorgung</b></td><td>Besonderes Opfer oder Dienst für die Allgemeinheit</td><td>Steuern</td><td>Beamtenpension, Kriegsopferversorgung</td></tr>\n<tr><td><b>Fürsorge</b></td><td>Bedürftigkeit, Antrag, Bedürftigkeitsprüfung</td><td>Steuern</td><td>Sozialhilfe, Grundsicherung (Bürgergeld bzw. Nachfolgeregelung)</td></tr></tbody></table></div>\n\n<h4>Drei Säulen der Altersvorsorge</h4>\n<p>1. <b>Gesetzliche Rente</b> (wichtigste Säule) · 2. <b>Betriebliche Altersversorgung</b> (Arbeitgeber) · 3. <b>Private Vorsorge</b> (z. B. Riester, Rürup, eigene Ersparnisse).</p>" });

<p>Grundlage ist deine Themenliste (alle Punkte bei dir abgehakt) plus die Folien zum Zweierkomplement:</p>

<tr><td><b>1.02 Bits &amp; Bytes</b></td><td>Byte = 8 Bit, SI- und Binärpräfixe (kilo bis Tera), benötigte Bits, Datenübertragungsrate und -dauer</td><td>Abschnitt 2</td></tr>

<tr><td><b>Zweierkomplement</b></td><td>Negative Zahlen, Wertebereich, Subtraktion, Überlauf (Folien; Arbeitsblatt S. 268, Aufgabe 5)</td><td>Abschnitt 4</td></tr></tbody></table></div>
<div class="box"><b>Empfohlener Lernweg:</b> 1. Abschnitt lesen und die Beispiele selbst nachrechnen · 2. Karteikarten, bis jede Karte „gewusst“ ist · 3. Rechentrainer: je Aufgabentyp etwa 10 Aufgaben, bis du ohne Rechenweg richtig liegst · 4. Quiz · 5. Probetest unter Zeit, danach alle Fehler noch einmal rechnen.</div>
<div class="warn"><b>Was ich nicht gesehen habe:</b> die Moodle-Aufgabenblätter (AB S. 265ff, S. 269/7, S. 278/18, S. 486/3 und 4) und deren Lösungen. Rechne sie zusätzlich durch, besonders die Bild- und Protokollaufgaben. Ich habe diese Themen nach allgemeinem Vorgehen aufgebaut; die Anleitung steht im Test in der Aufgabe.</div>` });

    return { phase: 'run', preset, seed, name: plan.name, limit: plan.min, ask: null, tasks, total: tasks.reduce((a, t) => a + t.pts, 0), t0: Date.now(), timer: null };

      return `<div class="task ${done ? (ok ? 'ok' : 'no') : ''}">${head}<div class="q">${t.prompt}</div>
        ${done ? `<p>Deine Antwort: <code>${esc(t.user) || '(leer)'}</code> ${ok ? '✓' : '✗'}</p><div class="sol"><b>Lösung:</b> ${t.solution}</div>`
        : `<div class="row"><input type="text" class="big" data-ti="${t.n - 1}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t.ph || '')}" value="${esc(t.user)}" aria-label="Antwort Aufgabe ${t.n}"></div>`}</div>`;
    }
    if (t.kind === 'mc') {
      const ok = done ? evalTask(t) : null;
      return `<div class="task ${done ? (ok ? 'ok' : 'no') : ''}">${head}<div class="q">${t.prompt}</div><div class="opts rlist">${t.opts.map((o, i) =>
        done ? `<div class="opt ${o.c ? 'right' : (t.user === i ? 'wrong' : '')}">${o.t}</div>`
          : `<label class="opt"><input type="radio" name="mc${t.n}" value="${i}" data-tm="${t.n - 1}" ${t.user === i ? 'checked' : ''}> <span>${o.t}</span></label>`).join('')}</div>
        ${done ? `<div class="sol">${t.w}</div>` : ''}</div>`;
    }
    const half = Math.round(t.pts / 2);
    return `<div class="task self">${head}<div class="q">${t.prompt}</div>
      ${done ? `<p class="muted">Deine Antwort:</p><div class="sol" style="margin-top:0">${esc(t.user).replace(/\n/g, '<br>') || '(leer)'}</div>
        <div class="sol"><b>Musterlösung:</b> ${t.model}</div>
        <div class="row"><span>Bewerte dich ehrlich:</span>
        <button class="btn small ${t.rating === t.pts ? '' : 'ghost'}" data-act="prate" data-i="${t.n - 1}" data-v="${t.pts}">voll (${t.pts})</button>
        ${t.pts > 1 ? `<button class="btn small ${t.rating === half ? '' : 'ghost'}" data-act="prate" data-i="${t.n - 1}" data-v="${half}">teilweise (${half})</button>` : ''}
        <button class="btn small ${t.rating === 0 ? 'bad' : 'ghost'}" data-act="prate" data-i="${t.n - 1}" data-v="0">nichts (0)</button></div>`
      : `<textarea data-ts="${t.n - 1}" placeholder="Deine Antwort in Stichpunkten oder ganzen Sätzen" aria-label="Antwort Aufgabe ${t.n}">${esc(t.user)}</textarea>`}</div>`;
  }
  function viewPT(v) {
    const f = state.fach, s = S[f], pt = s.pt;
    if (!pt || pt.phase === 'setup') {
      v.innerHTML = `<div class="card"><h3 style="margin-top:0">Probetest für ${FACH[f].label}</h3>
        <p class="muted">Aufgaben mit zufälligen Zahlen, Multiple Choice und Freitext wie in einer Klassenarbeit. Rechenaufgaben werden automatisch geprüft, Freitext bewertest du anhand der Musterlösung selbst. Die Note folgt dem Schlüssel 92/81/67/50/30 %.</p>
        <div class="choice">${['kurz', 'voll'].map((k) => { const p = PLAN[f][k]; const n = p.gens.length + p.mc + p.self; return `<button class="btnc" data-act="pstart" data-v="${k}"><b>${p.name}</b><span>${n} Aufgaben · Richtzeit ${p.min} Minuten</span></button>`; }).join('')}</div>
        <div class="row"><label class="inl">Test-Nr. (optional, gleiche Nr. = gleicher Test) <input type="number" id="ptseed" placeholder="z. B. 123456" min="1" style="width:170px"></label></div></div>`;
      return;
    }
    const parts = [['input', 'Teil A · Rechen- und Codierungsaufgaben'], ['mc', 'Teil B · Multiple Choice'], ['self', 'Teil C · Freitext']];
    const body = parts.map(([k, name]) => { const ts = pt.tasks.filter((t) => t.kind === k); if (!ts.length) return ''; return `<h3 class="part">${name} (${ts.reduce((a, t) => a + t.pts, 0)} P.)</h3>` + ts.map((t) => taskHTML(t, pt.phase === 'done')).join(''); }).join('');
    if (pt.phase === 'run') {
      v.innerHTML = `<div class="card"><div class="row" style="margin-top:0;justify-content:space-between"><div><b>${pt.name}</b> · Test-Nr. ${pt.seed} · ${pt.total} Punkte</div><span class="timer" id="timer">Noch ${fmtT(pt.limit * 60)}</span></div></div>${body}
        ${pt.ask ? `<div class="fb no"><b>${pt.ask === 'submit' ? 'Test jetzt abgeben und auswerten?' : 'Test abbrechen? Deine Eingaben gehen verloren.'}</b>
        <div class="row"><button class="btn" data-act="pyes">Ja</button><button class="btn ghost" data-act="pno">Nein, weiter</button></div></div>`
        : `<div class="row center"><button class="btn" data-act="psubmit">Abgeben und auswerten</button><button class="btn ghost" data-act="pcancel">Abbrechen</button></div>`}`;
      tick(); return;
    }
    const sc = score(pt), pct = Math.round(1000 * sc.got / pt.total) / 10, g = schulnote(pct);
    v.innerHTML = `<div class="card result"><div class="big">${sc.got} / ${pt.total} Punkte</div><div class="note">${fmtNum(pct, 1)} % · Note <b>${g.text}</b> (${g.name})</div>
      ${sc.open ? `<p class="muted">Vorläufig: ${sc.open} Freitextaufgabe${sc.open > 1 ? 'n sind' : ' ist'} noch nicht bewertet.</p>` : ''}
      <div class="row center"><button class="btn" data-act="pnew">Neuer Probetest</button><button class="btn ghost" data-act="pagain">Gleichen Test wiederholen (Nr. ${pt.seed})</button></div></div>${body}`;
  }

  /* ---------- Ereignisse ---------- */
  function onClick(e) {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act, f = state.fach, s = S[f];
    switch (act) {
      case 'fach': state.fach = a.dataset.v; render(); window.scrollTo(0, 0); return;
      case 'tab': state.tab = a.dataset.v; render(); return;
      case 'theme': { const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const n = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); store.set('theme', n); return; }
      /* Karteikarten */
      case 'kkflip': kkState().flip = !kkState().flip; render(); return;
      case 'kkknow': { const kk = kkState(), c = D.cards[f][kk.queue[0]]; kk.known.add(c.q); kk.queue.shift(); kk.flip = false; kkSave(); render(); return; }
      case 'kkagain': { const kk = kkState(); kk.queue.push(kk.queue.shift()); kk.flip = false; render(); return; }
      case 'kktopic': kkState().topic = a.dataset.v; kkBuild(); render(); return;
      case 'kkshuf': kkBuild(); render(); return;
      case 'kkreset': { const kk = kkState(); D.cards[f].forEach((c) => { if (kk.topic === 'Alle' || c.t === kk.topic) kk.known.delete(c.q); }); kkSave(); kkBuild(); render(); return; }
      /* Quiz */
      case 'qzstart': { const q = s.qz; q.topic = $('#qz-topic').value; q.count = +$('#qz-count').value; qzStart(D.mc[f].filter((m) => q.topic === 'Alle' || m.t === q.topic), q.count); render(); return; }
      case 'qzpick': { const q = s.qz; if (q.picked !== null) return; q.picked = +a.dataset.i; const m = q.list[q.i]; if (m.opts[q.picked].c) q.right++; else q.wrong.push(m); render(); return; }
      case 'qznext': { const q = s.qz; if (q.i + 1 < q.list.length) { q.i++; q.picked = null; } else q.phase = 'done'; render(); window.scrollTo(0, 0); return; }
      case 'qzretry': { const q = s.qz, pool = q.wrong.map((m) => m.src); qzStart(pool, 0); render(); return; }
      case 'qznew': s.qz.phase = 'setup'; render(); return;
      /* Trainer */
      case 'tcheck': { const tr = s.tr, val = $('#tin').value; if (!val.trim()) { $('#tin').focus(); return; } tr.val = val; tr.checked = true; tr.ok = !!tr.task.check(val); tr.n++; if (tr.ok) { tr.right++; tr.streak++; tr.best = Math.max(tr.best, tr.streak); } else tr.streak = 0; render(); return; }
      case 'treveal': { const tr = s.tr; tr.val = $('#tin').value; tr.checked = true; tr.ok = false; tr.n++; tr.streak = 0; render(); return; }
      case 'tnext': newTask(); render(); return;
      /* Probetest */
      case 'pstart': { const raw = $('#ptseed') && $('#ptseed').value; const seed = raw && +raw > 0 ? Math.floor(+raw) : rndSeed(); stopTimer(s.pt); s.pt = buildTest(f, a.dataset.v, seed); s.pt.timer = setInterval(tick, 1000); render(); window.scrollTo(0, 0); return; }
      case 'psubmit': s.pt.ask = 'submit'; render(); return;
      case 'pcancel': s.pt.ask = 'cancel'; render(); return;
      case 'pno': s.pt.ask = null; render(); return;
      case 'pyes': { const pt = s.pt; if (pt.ask === 'submit') { stopTimer(pt); pt.phase = 'done'; pt.ask = null; render(); window.scrollTo(0, 0); } else { stopTimer(pt); s.pt = null; render(); } return; }
      case 'prate': { const t = s.pt.tasks[+a.dataset.i]; t.rating = +a.dataset.v; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
      case 'pnew': stopTimer(s.pt); s.pt = null; render(); window.scrollTo(0, 0); return;
      case 'pagain': { const old = s.pt; s.pt = buildTest(f, old.preset, old.seed); s.pt.timer = setInterval(tick, 1000); render(); window.scrollTo(0, 0); return; }
      default:
    }
  }
  function onInput(e) {
    const t = e.target, pt = S[state.fach].pt;
    if (t.dataset && t.dataset.ti !== undefined && pt) pt.tasks[+t.dataset.ti].user = t.value;
    if (t.dataset && t.dataset.ts !== undefined && pt) pt.tasks[+t.dataset.ts].user = t.value;
  }
  function onChange(e) {
    const t = e.target, f = state.fach, s = S[f];
    if (t.id === 'tgen') { s.tr.key = t.value; newTask(); render(); }
    if (t.id === 'tsatz') { s.tr.satz = t.value; newTask(); render(); }
    if (t.dataset && t.dataset.tm !== undefined && s.pt) s.pt.tasks[+t.dataset.tm].user = +t.value;
  }
  function onKey(e) {
    const f = state.fach, s = S[f];
    if (e.key === 'Enter' && e.target.id === 'tin' && s.tr && !s.tr.checked) { e.preventDefault(); onClick({ target: { closest: () => ({ dataset: { act: 'tcheck' } }) } }); }
    else if (e.key === 'Enter' && s.tr && s.tr.checked && state.tab === 'tr' && e.target.tagName !== 'BUTTON') { e.preventDefault(); newTask(); render(); }
    if ((e.key === ' ' || e.key === 'Enter') && e.target.classList && e.target.classList.contains('flash')) { e.preventDefault(); kkState().flip = !kkState().flip; render(); const c = $('.flash'); if (c) c.focus(); }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const th = store.get('theme', null); if (th) document.documentElement.setAttribute('data-theme', th);
    const app = document.getElementById('app');
    app.addEventListener('click', onClick); app.addEventListener('input', onInput); app.addEventListener('change', onChange); app.addEventListener('keydown', onKey);
    render();
  });
})();

</script>
</body>
</html>
