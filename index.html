<body>
<div class="wrap" id="app">
  <header class="top">
    <div><h1>Lernhilfe</h1><p>Stand 1. November 2026 · Lernhilfen, Abfragen und Probetests</p></div>
    <button class="btn ghost small" data-act="theme" aria-label="Hell oder dunkel umschalten">Hell / Dunkel</button>
  </header>
  <div class="faches" id="faches"></div>
  <div class="tabs" id="tabs"></div>
  <main id="view"></main>
  <footer class="foot">Alle Zahlen zur Sozialversicherung und Steuer: Stand 2026, online geprüft. Das Material deiner Lehrkraft hat im Zweifel Vorrang.</footer>
</div>
<script>
'use strict';
/* ===== Hilfsfunktionen ===== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed >>> 0);
  return {
    next: r,
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(r() * arr.length)],
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
  };
}
const bin = (n, w) => n.toString(2).padStart(w || 1, '0');
const hexs = (n, w) => n.toString(16).toUpperCase().padStart(w || 1, '0');
function grp(s) {
  const out = [];
  for (let i = s.length; i > 0; i -= 4) out.unshift(s.slice(Math.max(0, i - 4), i));
  return out.join(' ');
}
const cleanBits = (s) => String(s).replace(/[\s_.]/g, '');
function twos(n, bits) { return bin(n < 0 ? (1 << bits) + n : n, bits); }
function fromTwos(s) { const v = parseInt(s, 2); return s[0] === '1' ? v - Math.pow(2, s.length) : v; }
function invert(s) { return s.split('').map((c) => (c === '0' ? '1' : '0')).join(''); }
function powSum(n) {
  const parts = [];
  for (let i = 20; i >= 0; i--) if (n & (1 << i)) parts.push(String(1 << i));
  return parts.join(' + ');
}
function parseNum(s) {
  let t = String(s).trim().replace(/\u2212/g, '-').replace(/[€\s]|sek\.?|s$|byte|bit|mbit\/s|mb|minuten|min/gi, '');
  if (!t) return NaN;
  if (t.indexOf('.') >= 0 && t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  else if (t.indexOf(',') >= 0) t = t.replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}
const near = (s, v, tol) => { const x = parseNum(s); return !isNaN(x) && Math.abs(x - v) <= (tol === undefined ? 0.0001 : tol); };
function fmtNum(x, d) {
  return x.toLocaleString('de-DE', { minimumFractionDigits: d === undefined ? 0 : d, maximumFractionDigits: d === undefined ? 2 : d });
}
const eur = (cents) => (cents / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const stripHex = (s) => String(s).trim().replace(/^0x/i, '').replace(/^#/, '').replace(/\s/g, '').toUpperCase();

/* ===== EVP-Generatoren ===== */
const EVP = {};

EVP.dez2bin = { label: 'Dezimal → Dual', topic: 'Zahlensysteme', fn(r) {
  const n = r.int(23, 250), b = bin(n);
  return { pts: 2, ph: 'z. B. 1011 0101',
    prompt: `Wandle <b>${n}</b> (dezimal) in eine Dualzahl um.`,
    check: (s) => { const c = cleanBits(s); return /^[01]+$/.test(c) && parseInt(c, 2) === n; },
    solution: `<b>${grp(b)}</b><br>Rechenweg: ${n} = ${powSum(n)} (jede verwendete Zweierpotenz ergibt eine 1, jede nicht verwendete eine 0).` };
} };

EVP.bin2dez = { label: 'Dual → Dezimal', topic: 'Zahlensysteme', fn(r) {
  const n = r.int(16, 255), b = bin(n, 8);
  return { pts: 2, ph: 'Dezimalzahl',
    prompt: `Wandle die Dualzahl <b>${grp(b)}</b> in eine Dezimalzahl um.`,
    check: (s) => near(s, n),
    solution: `<b>${n}</b><br>Rechenweg: ${powSum(n)} = ${n} (Stellenwerte der Einsen addieren).` };
} };

EVP.bin2hex = { label: 'Dual → Hexadezimal', topic: 'Zahlensysteme', fn(r) {
  const len = r.pick([2, 2, 3]), n = r.int(16, Math.pow(16, len) - 1), b = bin(n, len * 4);
  const h = hexs(n, len);
  return { pts: 2, ph: 'z. B. 3F',
    prompt: `Wandle <b>${grp(b)}</b> (dual) in das Hexadezimalsystem um.`,
    check: (s) => { const c = stripHex(s); return /^[0-9A-F]+$/.test(c) && parseInt(c, 16) === n; },
    solution: `<b>${h}</b><br>Rechenweg: je 4 Bit (Tetrade) = 1 Hex-Ziffer: ${grp(b).split(' ').map((t, i) => t + '→' + h[i]).join(', ')}.` };
} };

EVP.hex2bin = { label: 'Hexadezimal → Dual', topic: 'Zahlensysteme', fn(r) {
  const len = r.pick([2, 2, 3]), n = r.int(16, Math.pow(16, len) - 1), h = hexs(n, len);
  return { pts: 2, ph: 'z. B. 1010 0011',
    prompt: `Wandle <b>${h}</b> (hexadezimal) in eine Dualzahl um.`,
    check: (s) => { const c = cleanBits(s); return /^[01]+$/.test(c) && parseInt(c, 2) === n; },
    solution: `<b>${grp(bin(n, len * 4))}</b><br>Rechenweg: jede Hex-Ziffer einzeln in 4 Bit: ${h.split('').map((d) => d + '→' + bin(parseInt(d, 16), 4)).join(', ')}.` };
} };

EVP.dez2hex = { label: 'Dezimal → Hexadezimal', topic: 'Zahlensysteme', fn(r) {
  const n = r.int(40, 1000), h = hexs(n);
  const steps = []; let q = n;
  while (q > 0) { steps.push(`${q} : 16 = ${Math.floor(q / 16)} Rest ${q % 16}${q % 16 > 9 ? ' (=' + hexs(q % 16) + ')' : ''}`); q = Math.floor(q / 16); }
  return { pts: 3, ph: 'z. B. 1A4',
    prompt: `Wandle <b>${n}</b> (dezimal) in das Hexadezimalsystem um.`,
    check: (s) => { const c = stripHex(s); return /^[0-9A-F]+$/.test(c) && parseInt(c, 16) === n; },
    solution: `<b>${h}</b><br>Rechenweg (Reste von unten nach oben lesen):<br>${steps.join('<br>')}` };
} };

EVP.hex2dez = { label: 'Hexadezimal → Dezimal', topic: 'Zahlensysteme', fn(r) {
  const len = r.pick([2, 3]), n = r.int(32, Math.pow(16, len) - 1), h = hexs(n, len);
  const terms = h.split('').map((d, i) => `${parseInt(d, 16)}·${Math.pow(16, len - 1 - i)}`).join(' + ');
  return { pts: 3, ph: 'Dezimalzahl',
    prompt: `Wandle <b>${h}</b> (hexadezimal) in eine Dezimalzahl um.`,
    check: (s) => near(s, n),
    solution: `<b>${n}</b><br>Rechenweg: ${terms} = ${n}.` };
} };

EVP.zkDez2Bin = { label: 'Zweierkomplement: Dezimal → Dual (8 Bit)', topic: 'Zweierkomplement', fn(r) {
  const neg = r.next() < 0.75, m = r.int(2, 127), n = neg ? -m : m, ans = twos(n, 8);
  const sol = neg
    ? `<b>${grp(ans)}</b><br>Rechenweg: |${n}| = ${m} = ${grp(bin(m, 8))} → alle Bits invertieren: ${grp(invert(bin(m, 8)))} → +1: <b>${grp(ans)}</b>.`
    : `<b>${grp(ans)}</b><br>Positive Zahlen werden wie gewohnt dargestellt, nur auf 8 Stellen mit führenden Nullen aufgefüllt (Vorzeichenbit = 0).`;
  return { pts: 3, ph: '8 Bit, z. B. 1011 0011',
    prompt: `Stelle <b>${n}</b> als 8-Bit-Zahl im <b>Zweierkomplement</b> dar.`,
    check: (s) => cleanBits(s) === ans, solution: sol };
} };

EVP.zkMin = { label: 'Zweierkomplement: kleinstmögliche Bitzahl', topic: 'Zweierkomplement', fn(r) {
  let n = 0; while (n === 0) n = r.int(-200, 200);
  let k = 2; while (!(n >= -Math.pow(2, k - 1) && n <= Math.pow(2, k - 1) - 1)) k++;
  const ans = twos(n, k);
  return { pts: 3, ph: 'so viele Bits wie nötig',
    prompt: `Stelle <b>${n}</b> im Zweierkomplement mit der <b>kleinstmöglichen Bitanzahl</b> dar (das Vorzeichenbit zählt mit).`,
    check: (s) => cleanBits(s) === ans,
    solution: `<b>${grp(ans)}</b> (${k} Bit)<br>Bei ${k} Bit reicht der Wertebereich von ${-Math.pow(2, k - 1)} bis ${Math.pow(2, k - 1) - 1}; bei ${k - 1} Bit wäre ${n} nicht darstellbar. ${n < 0 ? 'Betrag ' + bin(-n, k) + ' → invertieren ' + invert(bin(-n, k)) + ' → +1.' : 'Positive Zahl: Betrag binär, vorne eine 0 als Vorzeichenbit.'}` };
} };

EVP.zkBin2Dez = { label: 'Zweierkomplement: Dual → Dezimal (8 Bit)', topic: 'Zweierkomplement', fn(r) {
  const n = r.next() < 0.75 ? r.int(-127, -2) : r.int(2, 127), b = twos(n, 8);
  const sol = n < 0
    ? `<b>${n}</b><br>Weg 1: Vorzeichenbit hat den Stellenwert −128: −128 + ${parseInt(b, 2) - 128} = ${n}.<br>Weg 2: invertieren ${grp(invert(b))} → +1 = ${grp(bin(-n, 8))} = ${-n}, also −${-n}.`
    : `<b>${n}</b><br>Vorzeichenbit 0 → positive Zahl, normal addieren: ${powSum(n)} = ${n}.`;
  return { pts: 3, ph: 'Dezimalzahl (mit Vorzeichen)',
    prompt: `Die 8-Bit-Zahl <b>${grp(b)}</b> steht im Zweierkomplement. Welche Dezimalzahl ist das?`,
    check: (s) => near(s, n), solution: sol };
} };

EVP.zkSub = { label: 'Zweierkomplement: Subtraktion (8 Bit)', topic: 'Zweierkomplement', fn(r) {

    check: (s) => String(s).replace(/["„“'‚‘]/g, '').trim().toUpperCase() === ch, solution: `<b>${ch}</b><br>65 = A, daher ${code} = A + ${code - 65} = ${ch}.` };

EVP.parity = { label: 'Parität', topic: 'Codes', fn(r) {
  const k = r.int(1, 3), data = bin(r.int(1, 127), 7), ones = data.split('').filter((c) => c === '1').length;
  if (k <= 2) {
    const even = k === 1, bit = even ? ones % 2 : (ones + 1) % 2;
    return { pts: 3, ph: '0 oder 1',
      prompt: `Bilde das Paritätsbit für die 7 Datenbits <b>${data}</b> bei <b>${even ? 'gerader' : 'ungerader'}</b> Parität.`,
      check: (s) => String(s).trim() === String(bit),
      solution: `<b>${bit}</b><br>Die Daten enthalten ${ones} Einsen. Bei ${even ? 'gerader' : 'ungerader'} Parität muss die Gesamtzahl der Einsen (inklusive Paritätsbit) ${even ? 'gerade' : 'ungerade'} sein → Paritätsbit ${bit}; Ergebnis ${data}${bit}.` };
  }
  const ok = r.next() < 0.5; let byte = data + String(ones % 2);
  if (!ok) { const p = r.int(0, 7); byte = byte.slice(0, p) + (byte[p] === '0' ? '1' : '0') + byte.slice(p + 1); }
  const total = byte.split('').filter((c) => c === '1').length;
  return { pts: 3, ph: 'ja oder nein',
    prompt: `Es wird <b>gerade Parität</b> verwendet. Das letzte Bit ist das Paritätsbit. Wurde das Byte <b>${grp(byte)}</b> fehlerfrei übertragen? (ja/nein)`,
    check: (s) => { const t = String(s).trim().toLowerCase(); return ok ? /^(ja|fehlerfrei|ok)$/.test(t) : /^(nein|fehler|fehlerhaft)$/.test(t); },
    solution: `<b>${ok ? 'Ja (kein Fehler erkennbar)' : 'Nein (Fehler erkannt)'}</b><br>Das Byte enthält ${total} Einsen, das ist ${total % 2 === 0 ? 'gerade' : 'ungerade'} → ${ok ? 'Parität stimmt.' : 'Parität verletzt, also mindestens ein Bit ist gekippt.'}` };
} };

// Satz-Sets (AN-Anteil = Hälfte des Gesamtbeitrags). "blatt" = Tabelle auf dem Arbeitsblatt (Stand 2024), "aktuell" = 2026.
const SATZ = {
  blatt:   { key: 'blatt',   name: 'Arbeitsblatt (Stand 2024)', kv: 7.3, zusatz: 1.7, pv: 1.7, pvKl: 0.6, rv: 9.3, av: 1.2, bbgKv: 5175, bbgRv: 7550 },
  aktuell: { key: 'aktuell', name: 'aktuell (2026)',            kv: 7.3, zusatz: 2.9, pv: 1.8, pvKl: 0.6, rv: 9.3, av: 1.3, bbgKv: 5812.5, bbgRv: 8450 }
};
const SV = { kistSatz: 9 };
function nettoCalc(o) {
  // o: brutto (EUR), lst (EUR), kirche (bool), zusatz (%), kinderlos (bool), vl (EUR), satz ('blatt'|'aktuell'), rates (Überschreibung)
  const R = Object.assign({}, SATZ[o.satz || 'blatt'], o.rates || {});
  const zusatz = o.zusatz === undefined ? R.zusatz : o.zusatz;
  const baseKv = Math.min(o.brutto, R.bbgKv), baseRv = Math.min(o.brutto, R.bbgRv);
  const c = (base, rate) => Math.round(base * rate);          // Euro * Prozent = Cent, kaufmännisch gerundet
  const rKv = R.kv + zusatz / 2, rPv = R.pv + (o.kinderlos ? R.pvKl : 0), rRv = R.rv, rAv = R.av;
  const kv = c(baseKv, rKv), pv = c(baseKv, rPv), rv = c(baseRv, rRv), av = c(baseRv, rAv);
  const kist = o.kirche ? Math.floor(o.lst * SV.kistSatz + 1e-6) : 0;   // Kirchensteuer und Soli werden abgerundet
  const lst = Math.round(o.lst * 100), bruttoC = Math.round(o.brutto * 100), vl = Math.round((o.vl || 0) * 100);
  const svSum = kv + pv + rv + av;
  const netto = bruttoC - lst - kist - svSum;
  return { bruttoC, lst, soli: 0, kist, kv, pv, rv, av, svSum, netto, vl, auszahlung: netto - vl,
    agKv: kv, agPv: c(baseKv, R.pv), agRv: rv, agAv: av, rates: { kv: rKv, pv: rPv, rv: rRv, av: rAv, zusatz },
    ueberKv: o.brutto > R.bbgKv, ueberRv: o.brutto > R.bbgRv, bbgKv: R.bbgKv, bbgRv: R.bbgRv };
}
function nettoTable(o, x) {
  const row = (a, b, neg) => `<tr><td>${a}</td><td class="num">${neg ? '− ' : ''}${eur(b)}</td></tr>`;
  const p = (v) => fmtNum(v, 2);
  return `<table class="calc"><tbody>
    <tr><td><b>Bruttoentgelt</b></td><td class="num"><b>${eur(x.bruttoC)}</b></td></tr>
    ${row('Lohnsteuer (laut Aufgabe)', x.lst, true)}

    ${row('Krankenversicherung ' + p(x.rates.kv) + ' % (7,3 % + halber Zusatzbeitrag ' + p(x.rates.zusatz / 2) + ' %)', x.kv, true)}
    ${row('Pflegeversicherung ' + p(x.rates.pv) + ' %' + (o.kinderlos ? ' (inkl. 0,6 % Zuschlag für Kinderlose)' : ''), x.pv, true)}
    ${row('Rentenversicherung ' + p(x.rates.rv) + ' %', x.rv, true)}

}

  const R = SATZ[key || 'blatt'], z = zusatz === undefined ? R.zusatz : zusatz;

}

/* Sozialauswahl nach dem Punkteschema des Arbeitsblatts (JIKU IT-Solutions GmbH) */
function sozialPunkte(p) {
  const alter = Math.min(p.alter, 55);
  const eintritt = p.alter - p.jahre, gez = Math.max(0, Math.min(p.alter, 55) - eintritt);   // nur Zeiten bis zum 55. Lebensjahr
  const bz = gez <= 10 ? gez : Math.min(70, 10 + 2 * (gez - 10));
  const unterhalt = p.kinder * 4 + (p.verh ? 8 : 0), schwer = p.schwer ? 5 : 0;
  return { alter, bz, unterhalt, schwer, summe: alter + bz + unterhalt + schwer };
}

function schulnote(pct) {
  const names = ['', 'sehr gut', 'gut', 'befriedigend', 'ausreichend', 'mangelhaft', 'ungenügend'];
  const bands = [[92, 1], [81, 2], [67, 3], [50, 4], [30, 5], [0, 6]];
  let hi = 100;
  for (const [lo, n] of bands) {
    if (pct >= lo) {
      const third = (hi - lo + 1) / 3, pos = pct - lo;
      let tend = pos >= 2 * third ? '+' : pos < third ? '\u2212' : '';
      if (n === 1 && tend === '+') tend = '';
      if (n === 6 && tend === '\u2212') tend = '';
      return { n, tend, text: n + tend, name: names[n] };
    }
    hi = lo - 1;
  }
  return { n: 6, tend: '', text: '6', name: names[6] };
}

{ id: 'zs', title: '1 · Zahlensysteme (Dezimal, Dual, Hexadezimal)', open: true, html: `
<div class="box"><b>Stellenwertsystem:</b> Der Wert einer Ziffer ist <b>Ziffer × Basis<sup>Position</sup></b>. Die Position zählt von rechts und beginnt bei 0.
Dezimal hat die Basis 10, Dual (Binär) die Basis 2, Hexadezimal die Basis 16.</div>

<h4>Zweierpotenzen (auswendig bis 2<sup>10</sup>, der Rest hilft)</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>Potenz</th><th>2⁰</th><th>2¹</th><th>2²</th><th>2³</th><th>2⁴</th><th>2⁵</th><th>2⁶</th><th>2⁷</th><th>2⁸</th><th>2⁹</th><th>2¹⁰</th></tr></thead>
<tbody><tr><th>Wert</th><td>1</td><td>2</td><td>4</td><td>8</td><td>16</td><td>32</td><td>64</td><td>128</td><td>256</td><td>512</td><td>1024</td></tr></tbody></table></div>
<p class="muted">Weiter: 2¹¹ = 2048 · 2¹² = 4096 · 2¹³ = 8192 · 2¹⁴ = 16384 · 2¹⁵ = 32768 · 2¹⁶ = 65536</p>

<h4>Hex-Tabelle (0 bis 15), vollständig</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>Dez</th><th>Dual</th><th>Hex</th><th>Dez</th><th>Dual</th><th>Hex</th></tr></thead><tbody>
<tr><td>0</td><td>0000</td><td>0</td><td>8</td><td>1000</td><td>8</td></tr>
<tr><td>1</td><td>0001</td><td>1</td><td>9</td><td>1001</td><td>9</td></tr>
<tr><td>2</td><td>0010</td><td>2</td><td>10</td><td>1010</td><td><b>A</b></td></tr>
<tr><td>3</td><td>0011</td><td>3</td><td>11</td><td>1011</td><td><b>B</b></td></tr>
<tr><td>4</td><td>0100</td><td>4</td><td>12</td><td>1100</td><td><b>C</b></td></tr>
<tr><td>5</td><td>0101</td><td>5</td><td>13</td><td>1101</td><td><b>D</b></td></tr>
<tr><td>6</td><td>0110</td><td>6</td><td>14</td><td>1110</td><td><b>E</b></td></tr>
<tr><td>7</td><td>0111</td><td>7</td><td>15</td><td>1111</td><td><b>F</b></td></tr></tbody></table></div>

<h4>Die vier Umrechnungen mit Beispiel (alle mit der Zahl 181)</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>Richtung</th><th>Vorgehen</th><th>Beispiel</th></tr></thead><tbody>
<tr><td><b>Dual → Dezimal</b></td><td>Stellenwerte der Einsen addieren</td><td>1011 0101 = 128 + 32 + 16 + 4 + 1 = <b>181</b></td></tr>
<tr><td><b>Dezimal → Dual</b></td><td>Von der größten passenden Zweierpotenz abwärts: passt sie, dann 1 schreiben und abziehen, sonst 0.<br><i>Alternative:</i> immer durch 2 teilen, Reste von unten nach oben lesen.</td>
<td>181 − 128 = 53 (1) · 64 passt nicht (0) · 53 − 32 = 21 (1) · 21 − 16 = 5 (1) · 8 passt nicht (0) · 5 − 4 = 1 (1) · 2 passt nicht (0) · 1 (1) → <b>1011 0101</b></td></tr>
<tr><td><b>Dual → Hex</b></td><td>Von rechts in 4er-Gruppen (Tetraden) teilen, jede Gruppe ergibt eine Hex-Ziffer. Links mit Nullen auffüllen.</td><td>1011 | 0101 → B | 5 = <b>B5</b></td></tr>
<tr><td><b>Hex → Dual</b></td><td>Jede Hex-Ziffer einzeln in 4 Bit schreiben</td><td>B5 → 1011 | 0101</td></tr>
<tr><td><b>Dezimal → Hex</b></td><td>Immer durch 16 teilen, Reste (als Hex-Ziffer) von unten nach oben</td><td>181 : 16 = 11 Rest 5 → 11 : 16 = 0 Rest 11 (B) → <b>B5</b></td></tr>
<tr><td><b>Hex → Dezimal</b></td><td>Jede Ziffer × 16<sup>Position</sup></td><td>B5 = 11 · 16 + 5 = <b>181</b></td></tr>
</tbody></table></div>

<div class="box"><b>Warum Hex in der Informatik?</b> Eine Hex-Ziffer entspricht genau 4 Bit, ein Byte also genau 2 Hex-Ziffern. Binärzahlen werden dadurch <b>kurz und gut lesbar</b>, und die Umrechnung Dual ↔ Hex geht ohne Rechnen. Typische Einsatzorte: Farbcodes (#FF8800), MAC-Adressen, Speicheradressen, Fehlercodes.</div>
<div class="warn"><b>Typische Fehler:</b> Tetraden von links statt von rechts bilden · „A“ bis „F“ mit 11 bis 16 statt 10 bis 15 belegen · beim Dezimal-Dual-Weg eine Zweierpotenz überspringen.</div>`},

{ id: 'bb', title: '2 · Bits & Bytes, Präfixe, Datenübertragung', html: `
<div class="box"><b>1 Byte = 8 Bit.</b> Mit <b>n Bit</b> lassen sich <b>2ⁿ verschiedene Werte</b> darstellen. Ohne Vorzeichen reichen 8 Bit von 0 bis 255.</div>

<h4>Wie viele Bit brauche ich für N Zustände?</h4>
<p>Gesucht ist das <b>kleinste k mit 2<sup>k</sup> ≥ N</b>. Beispiel: 100 Zustände → 2⁶ = 64 ist zu klein, 2⁷ = 128 reicht → <b>7 Bit</b>. Bei genau einer Zweierpotenz (z. B. 16 Zustände) reicht k = 4.</p>

<h4>SI-Präfixe und Binärpräfixe</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>SI (Zehnerpotenz)</th><th>Wert</th><th>Binär (Zweierpotenz)</th><th>Wert</th></tr></thead><tbody>
<tr><td>kilo (kB)</td><td>10³ = 1 000</td><td>Kibi (KiB)</td><td>2¹⁰ = 1 024</td></tr>
<tr><td>Mega (MB)</td><td>10⁶</td><td>Mebi (MiB)</td><td>2²⁰ = 1 048 576</td></tr>
<tr><td>Giga (GB)</td><td>10⁹</td><td>Gibi (GiB)</td><td>2³⁰</td></tr>
<tr><td>Tera (TB)</td><td>10¹²</td><td>Tebi (TiB)</td><td>2⁴⁰</td></tr></tbody></table></div>
<p><b>Umrechnen:</b> pro Stufe mit 1 000 (SI) bzw. 1 024 (binär) malnehmen oder teilen. SI und binär dürfen nicht gemischt werden: 1 GiB ≠ 1 GB.</p>
<div class="box"><b>Warum zeigt der PC weniger Speicher an?</b> Der Hersteller rechnet SI (1 TB = 10¹² Byte). Das Betriebssystem teilt durch 1024er-Potenzen: 10¹² ÷ 2³⁰ ≈ <b>931 GiB</b>. Windows schreibt dafür oft trotzdem „GB“.</div>

<h4>Datenübertragung</h4>
<div class="box"><b>t = Datenmenge ÷ Übertragungsrate</b> (Rate = Datenmenge pro Zeit).<br>
<b>Vorher die Einheiten angleichen:</b> Raten stehen in <b>Bit</b>/s (Mbit/s), Dateien in <b>Byte</b> (MB). 1 Byte = 8 Bit, also <b>1 MB/s = 8 Mbit/s</b>.</div>
<p>Beispiel: 500 MB über 100 Mbit/s → 500 · 8 = 4 000 Mbit → 4 000 ÷ 100 = <b>40 s</b>.<br>
Umgestellt: Datenmenge = Rate · Zeit, Rate = Datenmenge ÷ Zeit.</p>
<div class="warn"><b>Typische Fehler:</b> Großes B (Byte) und kleines b (Bit) verwechseln · MB direkt durch Mbit/s teilen, ohne mal 8 · SI- mit Binärpräfixen mischen.</div>`},

{ id: 'co', title: '3 · Codes: ASCII, Parität, Protokolle, Bilder', html: `
<h4>ASCII</h4>
<p>7-Bit-Code mit 128 Zeichen (0 bis 127), erweitert auf 8 Bit mit 256 Zeichen. Merkpunkte reichen, den Rest zählst du ab:</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Zeichen</th><th>Dezimal</th><th>Hex</th><th>Dual (8 Bit)</th></tr></thead><tbody>
<tr><td>Leerzeichen</td><td>32</td><td>20</td><td>0010 0000</td></tr>
<tr><td>„0“ bis „9“</td><td>48 bis 57</td><td>30 bis 39</td><td>„0“ = 0011 0000</td></tr>
<tr><td>„A“ bis „Z“</td><td>65 bis 90</td><td>41 bis 5A</td><td>„A“ = 0100 0001</td></tr>
<tr><td>„a“ bis „z“</td><td>97 bis 122</td><td>61 bis 7A</td><td>„a“ = 0110 0001</td></tr></tbody></table></div>
<p><b>Klein = Groß + 32</b> (genau ein Bit unterscheidet sich). Beispiel „E“: 65 + 4 = 69. Der Buchstabe ist der 5. des Alphabets, also 64 + 5.</p>

<h4>Parität</h4>
<div class="box">Ein <b>Paritätsbit</b> wird an die Daten angehängt. <b>Gerade Parität:</b> die Gesamtzahl der Einsen (inklusive Paritätsbit) ist gerade. <b>Ungerade Parität:</b> sie ist ungerade.</div>
<p><b>Bilden:</b> Einsen zählen, dann das Bit so setzen, dass die Regel stimmt. Beispiel „a“ = 110 0001 hat 3 Einsen, bei gerader Parität kommt eine 1 dazu: 1100 0011.<br>
<b>Prüfen:</b> Einsen im ganzen empfangenen Byte zählen. Passt die Regel, ist kein Fehler erkennbar; passt sie nicht, ist mindestens ein Bit gekippt.</p>
<div class="warn"><b>Grenzen:</b> erkennt <b>1-Bit-Fehler</b> (allgemein eine ungerade Zahl von Fehlern), erkennt <b>keine 2-Bit-Fehler</b>, kann den Fehler weder lokalisieren noch korrigieren.</div>

<h4>Protokolle dekodieren</h4>
<p>Bei Dekodierungsaufgaben bekommst du eine <b>Anleitung</b> (Feldlängen und Bedeutung). Vorgehen: 1. Bitfolge nach den Feldlängen <b>aufteilen</b>, 2. jedes Feld <b>einzeln</b> nach Vorschrift umrechnen (dezimal, Hex, ASCII), 3. Ergebnis zusammensetzen.</p>
<p>Beispiel Paket (Typ 4 Bit | Länge 4 Bit | Zeichen 8 Bit): <code>0011 0001 0100 0100</code> → Typ 0011 = 3, Länge 0001 = 1, Zeichen 0100 0100 = 68 = „D“.</p>
<p>Beispiel IPv4-Adresse: 32 Bit = vier Bytes, jeweils dezimal und mit Punkt geschrieben. <code>C0 A8 01 0A</code> (Hex) → 192 . 168 . 1 . 10, denn C0 = 12·16 = 192, A8 = 10·16 + 8 = 168.</p>

<h4>Bilder codieren</h4>
<div class="box">Ein Bild ist ein Raster aus <b>Pixeln</b>. Jeder Pixel speichert einen Farbwert mit der <b>Farbtiefe</b> (Bit pro Pixel).<br>
<b>Speicherbedarf = Breite × Höhe × Farbtiefe ÷ 8</b> (in Byte, unkomprimiert). <b>Anzahl Farben = 2<sup>Farbtiefe</sup></b>.</div>
<div class="scroll"><table class="tbl"><thead><tr><th>Farbtiefe</th><th>Farben</th><th>Typisch</th></tr></thead><tbody>
<tr><td>1 Bit</td><td>2</td><td>Schwarz/Weiß</td></tr><tr><td>8 Bit</td><td>256</td><td>Graustufen oder Farbpalette</td></tr>
<tr><td>24 Bit</td><td>ca. 16,7 Mio.</td><td>True Color: 3 · 8 Bit für Rot, Grün, Blau</td></tr></tbody></table></div>
<p>Beispiel: 1920 × 1080 Pixel mit 24 Bit = 2 073 600 · 24 ÷ 8 = 6 220 800 Byte ≈ <b>6,2 MB</b>.<br>
Schwarz/Weiß-Bild als Hex-Zeilen: jede Hex-Ziffer sind 4 Pixel (1 = schwarz, 0 = weiß, sofern in der Aufgabe so festgelegt). Aus <code>3C</code> wird 0011 1100.</p>
<p class="muted">Hinweis: Zur Aufgabe AB S. 278/18 habe ich nur den Titel gesehen. Bildaufgaben immer nach der Anleitung der Aufgabe lösen.</p>`},

{ id: 'zk', title: '4 · Zweierkomplement (negative Zahlen)', html: `
<div class="box"><b>Zweierkomplement</b> stellt negative ganze Zahlen dar. Das erste Bit (MSB) ist das <b>Vorzeichenbit</b>: 0 = positiv oder null, 1 = negativ. <b>Wichtig:</b> Die Bitbreite muss feststehen (meist 8 Bit), sonst ist die Zahl nicht eindeutig.</div>

<h4>Wertebereich bei n Bit: −2<sup>n−1</sup> … 2<sup>n−1</sup> − 1</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>Bits</th><th>kleinste Zahl</th><th>größte Zahl</th><th>Anzahl Werte</th></tr></thead><tbody>
<tr><td>4</td><td>−8</td><td>+7</td><td>16</td></tr><tr><td>8</td><td>−128</td><td>+127</td><td>256</td></tr><tr><td>16</td><td>−32 768</td><td>+32 767</td><td>65 536</td></tr></tbody></table></div>
<p>Es gibt eine negative Zahl mehr als positive, weil die Null auf der positiven Seite liegt.</p>

<h4>Negative Zahl bilden (drei Schritte)</h4>
<ol><li>Betrag als Dualzahl mit allen n Stellen schreiben (links mit Nullen füllen).</li><li><b>Alle Bits invertieren</b> (0 wird 1, 1 wird 0). Das ist das Einerkomplement.</li><li><b>1 addieren</b> → Zweierkomplement.</li></ol>
<p>Beispiel aus dem Unterricht, −77 mit 8 Bit: 77 = 0100 1101 → invertiert 1011 0010 → +1 = <b>1011 0011</b>. <br>
Zum Vergleich: Vorzeichen-Betrag ergäbe 1100 1101, das Einerkomplement 1011 0010. Beide haben zwei Nullen (+0 und −0) und rechnen schlechter, das Zweierkomplement hat nur eine Null.</p>

<h4>Zweierkomplement-Zahl lesen</h4>
<p><b>Weg 1:</b> Das MSB hat den <b>negativen Stellenwert −2<sup>n−1</sup></b>, alle anderen positiv. 1011 0011 = −128 + 32 + 16 + 2 + 1 = <b>−77</b>.<br>
<b>Weg 2:</b> Ist das MSB 1: invertieren, +1, Ergebnis ist der Betrag, davor ein Minus.</p>

<h4>Subtraktion = Addition der negativen Zahl</h4>
<p>a − b wird zu a + (−b). So braucht der Prozessor nur <b>ein Rechenwerk</b> (Addierer). Ein <b>Übertrag aus der höchsten Stelle wird verworfen</b>.</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Beispiel</th><th>Rechnung (8 Bit)</th></tr></thead><tbody>
<tr><td>10 + (−3) (Folie)</td><td>0000 1010 + 1111 1101 = 1 0000 0111 → Übertrag weg → 0000 0111 = <b>+7</b></td></tr>
<tr><td>34 − 62</td><td>34 = 0010 0010 · 62 = 0011 1110 → −62 = 1100 0010<br>0010 0010 + 1100 0010 = 1110 0100 = −128 + 64 + 32 + 4 = <b>−28</b></td></tr></tbody></table></div>

<h4>Überlauf (Overflow)</h4>
<p>Passt das Ergebnis nicht in den Wertebereich, ist es falsch. Beispiel 100 + 50 mit 8 Bit: 0110 0100 + 0011 0010 = 1001 0110 = −106 statt 150. <b>Erkennen:</b> zwei positive Zahlen ergeben ein negatives Ergebnis (oder zwei negative ein positives).</p>

<li><b>Ausbildungsordnung:</b> bundeseinheitliche Rechtsverordnung für einen Ausbildungsberuf. Sie legt fest, welche Inhalte und Kompetenzen vermittelt werden (Ausbildungsberufsbild, Ausbildungsrahmenplan mit sachlicher und zeitlicher Gliederung), wie lange die Ausbildung dauert und was geprüft wird. <b>Bedeutung:</b> Grundlage für den betrieblichen Ausbildungsplan und für die Prüfungen.</li>
<li><b>Gestreckte Abschlussprüfung</b> (Zusatz, nach IHK/FIAusbV geprüft): <b>AP1 (Teil 1)</b> im 4. Ausbildungshalbjahr, „Einrichten eines IT-gestützten Arbeitsplatzes“, schriftlich, 90 Minuten, <b>20 %</b> der Gesamtnote. <b>AP2 (Teil 2)</b> am Ende der Ausbildung, <b>80 %</b>. Beispiel Anwendungsentwicklung: Planen und Umsetzen eines Softwareprojekts (betriebliche Projektarbeit, 80 Std., mit Präsentation und Fachgespräch) 50 %, Planen eines Softwareproduktes 10 %, Entwicklung und Umsetzung von Algorithmen 10 %, Wirtschafts- und Sozialkunde (60 Min.) 10 %. In den anderen Fachrichtungen unterscheiden sich die berufsspezifischen Bereiche.</li></ul>

<h4>1.2 Duales System (002)</h4>
<div class="box">Die Berufsausbildung ist durch das <b>Berufsbildungsgesetz (BBiG)</b> geregelt. Sie findet an <b>zwei Lernorten</b> statt (Betrieb und Berufsschule) und ist in über <b>300 anerkannten Berufen</b> möglich. <b>Ziel (§ 1 BBiG):</b> berufliche Handlungsfähigkeit, also Fertigkeiten, Kenntnisse und Fähigkeiten, und der Erwerb der nötigen Berufserfahrung.</div>
<div class="scroll"><table class="tbl"><thead><tr><th></th><th>Betrieb</th><th>Berufsschule</th></tr></thead><tbody>
<tr><td><b>Grundlage</b></td><td>Ausbildungsordnung (nach BBiG)</td><td>Rahmenlehrplan mit Lernfeldern, schulisches Curriculum</td></tr>
<tr><td><b>Planung</b></td><td>Ausbildungsplan des Betriebs (was, wann, von wem, wie), Anlage zum Vertrag</td><td>schulische Jahresplanung</td></tr>
<tr><td><b>Vertrag</b></td><td>Berufsausbildungsvertrag: privatrechtlich, schriftlich (§ 4 Abs. 1 BBiG laut Blatt); Mindestinhalte § 11 BBiG</td><td>–</td></tr>
<tr><td><b>Nachweis</b></td><td>Ausbildungsnachweis (Berichtsheft), wird vom Azubi geführt und regelmäßig durchgesehen, bei der Prüfung vorgelegt</td><td>–</td></tr>
<tr><td><b>Aufsicht</b></td><td><b>IHK</b> (bzw. zuständige Stelle)</td><td>Schulleitung bzw. obere Schulaufsichtsbehörde</td></tr></tbody></table></div>
<p><b>Lernfelder:</b> 1 bis 6 für alle IT-Berufe: 1 Unternehmen und eigene Rolle · 2 Arbeitsplätze nach Kundenwunsch ausstatten · 3 Clients in Netzwerke einbinden · 4 Schutzbedarfsanalyse · 5 Software zur Verwaltung von Daten anpassen · 6 Serviceanfragen bearbeiten. Lernfelder 7 bis 9 getrennt für technische und kaufmännische IT-Berufe, 10 bis 13 individuell je Beruf bzw. Fachrichtung (Projektarbeit begleitet die Prüfungsvorbereitung).</p>
<p><b>Beteiligte:</b> <b>Auszubildende</b> (erlernen nach BBiG und Ausbildungsordnung einen anerkannten Beruf) · <b>Ausbildender</b> = der Betrieb, <b>Ausbilder</b> müssen <b>persönlich und fachlich geeignet</b> sein (§§ 28 bis 30 BBiG), nachgewiesen i. d. R. durch die Ausbildereignungsprüfung bei der IHK · <b>Berufsschule</b> · <b>IHK</b> (Ausbildungsberater, berät Betriebe <b>und</b> Azubis).</p>
<p><b>Kompetenzcheck, Lösung:</b></p>
<div class="scroll"><table class="tbl"><thead><tr><th>Aussage</th><th>Lösung</th></tr></thead><tbody>
<tr><td>a) Die duale Berufsausbildung dauert grundsätzlich zwei Jahre.</td><td><b>Falsch</b> (IT-Berufe 3 Jahre, je nach Beruf 2 bis 3,5 Jahre)</td></tr>
<tr><td>b) Rechtsgrundlage ist das BBiG.</td><td><b>Richtig</b></td></tr>
<tr><td>c) Ausbilder kann jeder Mitarbeiter ohne Eignungsprüfung sein.</td><td><b>Falsch</b></td></tr>
<tr><td>d) Ein Ausbilder muss persönlich und fachlich geeignet sein.</td><td><b>Richtig</b> (§§ 28 bis 30)</td></tr>
<tr><td>e) Lernorte sind Betrieb und Berufsschule.</td><td><b>Richtig</b></td></tr>
<tr><td>f) Der Ausbildungsvertrag kann auch mündlich geschlossen werden.</td><td><b>Falsch</b> (schriftlich)</td></tr>
<tr><td>g) Die IHK berät ausschließlich Betriebe, nicht Azubis.</td><td><b>Falsch</b> (beide)</td></tr>
<tr><td>h) Jeder Betrieb erstellt nach der Ausbildungsordnung einen Ausbildungsplan.</td><td><b>Richtig</b></td></tr>
<tr><td>i) Die Berufsschule unterrichtet nach dem Rahmenlehrplan in Lernfeldern.</td><td><b>Richtig</b></td></tr>
<tr><td>j) Die Abschlussprüfung der IHK findet am Ende der Ausbildung statt.</td><td><b>Richtig</b> (bei der gestreckten Prüfung Teil 1 früher, Teil 2 am Ende)</td></tr>
<tr><td>k) Der Unterricht ist in allen IT-Berufen von Anfang bis Ende identisch.</td><td><b>Falsch</b> (erst gemeinsame Kernqualifikationen, dann berufsspezifisch)</td></tr></tbody></table></div>

<h4>1.3 Rechte und Pflichten (003, §§ 13 bis 17 BBiG)</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>Pflichten des Ausbildenden = Rechte des Azubi</th><th>Pflichten des Azubi</th></tr></thead><tbody>
<tr><td><b>Ausbildungspflicht:</b> Fertigkeiten, Kenntnisse und Erfahrungen planmäßig vermitteln (§ 14)</td><td><b>Lernpflicht:</b> sich bemühen, das Ausbildungsziel zu erreichen (§ 13)</td></tr>
<tr><td><b>Zeugnispflicht:</b> Zeugnis bei Beendigung (§ 16)</td><td><b>Geheimhaltungspflicht:</b> über Betriebs- und Geschäftsgeheimnisse schweigen</td></tr>
<tr><td><b>Freistellung</b> für Berufsschule, außerbetriebliche Ausbildung und Prüfungen (§§ 14, 15)</td><td><b>Teilnahme</b> an Berufsschule, Ausbildungsmaßnahmen und Prüfungen</td></tr>
<tr><td><b>Weisungsberechtigte Personen</b> benennen</td><td><b>Weisungsgebundenheit:</b> Weisungen folgen</td></tr>
<tr><td><b>Aufsichtspflicht</b> bei Minderjährigen (§ 1631 BGB)</td><td><b>Ordnung</b> der Ausbildungsstätte einhalten</td></tr>
<tr><td><b>Ausbildungsnachweis:</b> kostenfrei aushändigen, Führung überwachen</td><td><b>Ausbildungsnachweis</b> ordnungsgemäß (schriftlich oder digital) führen und vorlegen</td></tr>
<tr><td><b>Ausbildungsmittel</b> kostenfrei bereitstellen</td><td>Ausbildungsmittel und Einrichtungen <b>pfleglich behandeln</b></td></tr>
<tr><td><b>Urlaub</b> gewähren (BUrlG, JArbSchG), möglichst zusammenhängend</td><td><b>Erholungspflicht:</b> im Urlaub keine dem Zweck widersprechende Erwerbstätigkeit (§ 8 BUrlG)</td></tr>
<tr><td><b>Vergütung:</b> angemessen, spätestens am <b>letzten Arbeitstag des Monats</b>, jährlich steigend, nicht unter der Mindestausbildungsvergütung, Tarif geht vor; bei Krankheit <b>6 Wochen</b> weiter, danach Krankengeld (§§ 17, 18)</td><td><b>Benachrichtigungspflicht:</b> bei Fehlen unverzüglich Bescheid geben, bei Krankheit ab dem <b>3. Tag</b> ärztliche Bescheinigung</td></tr>
<tr><td><b>Zweckgebundene Aufgaben:</b> nur Aufgaben, die dem Ausbildungszweck dienen und den körperlichen Kräften angemessen sind (§ 14)</td><td><b>Sorgfältige Ausführung</b> der aufgetragenen Aufgaben</td></tr></tbody></table></div>
<p><b>Weitere Regelungen im BBiG:</b> § 7 Anrechnung beruflicher Vorbildung · § 8 Abkürzung und Verlängerung · §§ 10 bis 12 Vertrag und Ausbilder · <b>§ 20 Probezeit</b> · §§ 21 und 24 Beendigung.</p>

<h4>1.4 Ausbildungsvertrag (004)</h4>
<p>Der Vertrag wird <b>vor Beginn schriftlich</b> geschlossen, von Ausbildendem, Azubi und (bei Minderjährigen) den gesetzlichen Vertretern unterschrieben, ausgehändigt und bei der <b>IHK</b> zur Eintragung ins Verzeichnis der Berufsausbildungsverhältnisse eingereicht. Beizufügen ist der <b>Ausbildungsplan</b>. Vereinbarungen gegen Sinn und Zweck der Ausbildung oder gegen Gesetze sind unzulässig.</p>
<div class="box"><b>Mindestinhalte nach § 11 BBiG:</b> 1. Art, sachliche und zeitliche Gliederung und Ziel · 2. Beginn und Dauer · 3. Maßnahmen außerhalb der Ausbildungsstätte · 4. tägliche Ausbildungszeit · 5. <b>Dauer der Probezeit</b> · 6. Zahlung und Höhe der Vergütung · 7. Dauer des Urlaubs · 8. Voraussetzungen für die Kündigung · 9. Hinweise auf Tarifverträge und Betriebsvereinbarungen · 10. Form des Ausbildungsnachweises</div>
<p><b>Kompetenzcheck Aufgabe 1:</b> Nicht in den Vertrag aufgenommen werden müssen: <b>c)</b> Bescheinigung über die ärztliche Erstuntersuchung (steht im Anhang/ist Voraussetzung, nicht Vertragsinhalt), <b>e)</b> „entspricht dem BBiG und der Ausbildungsordnung“, <b>i)</b> kalkulierte Kosten der Ausbildung. Alle anderen (Beginn, Probezeit, Vergütung, Urlaub, Maßnahme außerhalb, tägliche Zeit) stehen in § 11.</p>
<p><b>Kompetenzcheck Aufgabe 2:</b></p>
<div class="scroll"><table class="tbl"><thead><tr><th>Aussage</th><th>Lösung</th></tr></thead><tbody>
<tr><td>a) Der Vertrag enthält einen Anhang mit Hinweisen zur ärztlichen Untersuchung.</td><td><b>Richtig</b></td></tr>
<tr><td>b) Die Probezeit muss mindestens 1 Monat und darf höchstens 4 Monate betragen.</td><td><b>Richtig</b> (§ 20 BBiG)</td></tr>
<tr><td>c) Nach der Probezeit kann <b>fristlos</b> gekündigt werden, wenn man sich für eine andere Ausbildung entscheidet.</td><td><b>Falsch</b>: der Azubi kann dann mit <b>4 Wochen</b> Frist kündigen (§ 22 Abs. 2 Nr. 2)</td></tr>
<tr><td>d) Der Tätigkeitsnachweis darf nicht in der Ausbildungszeit geführt werden.</td><td><b>Falsch</b> (er wird während der Ausbildung geführt)</td></tr>
<tr><td>e) Vorangegangene Vorbildungen können die Ausbildungszeit verkürzen.</td><td><b>Richtig</b> (§ 7)</td></tr>
<tr><td>f) Eine Verlängerung ist jederzeit ohne Begründung möglich.</td><td><b>Falsch</b> (nur in Ausnahmefällen, wenn nötig für das Ausbildungsziel, auf Antrag, § 8)</td></tr>
<tr><td>g) Die Ausbildung endet immer genau am vereinbarten Termin.</td><td><b>Falsch</b> (endet mit bestandener Abschlussprüfung, ggf. früher; bei Nichtbestehen auf Verlangen Verlängerung)</td></tr>
<tr><td>h) Azubis müssen sich selbst bei der IHK zur Prüfung anmelden.</td><td><b>Falsch</b> (der Ausbildende meldet an)</td></tr>
<tr><td>i) Nach Ende der Ausbildung darf man den Betrieb nicht mehr ohne Vertrag betreten.</td><td><b>Falsch</b> (wer ohne Vereinbarung weiterbeschäftigt wird, hat nach § 24 BBiG ein unbefristetes Arbeitsverhältnis)</td></tr></tbody></table></div>

<h4>Probezeit und Kündigung bei Azubis (Prüfungsthema)</h4>
<div class="scroll"><table class="tbl"><tbody>
<tr><th>Dauer</th><td><b>mindestens 1, höchstens 4 Monate</b> (§ 20 BBiG), steht im Vertrag. Fünf Monate sind nicht erlaubt.</td></tr>
<tr><th>Kündigung in der Probezeit</th><td>von <b>beiden Seiten jederzeit ohne Frist</b> und ohne Angabe von Gründen (§ 22 Abs. 1). Nicht „14 Tage“, das gilt für normale Arbeitsverhältnisse mit Probezeit (2 Wochen).</td></tr>
<tr><th>Nach der Probezeit</th><td>Betrieb: nur <b>fristlos aus wichtigem Grund</b> (innerhalb von 2 Wochen nach Kenntnis). Azubi: mit <b>4 Wochen</b> Frist bei Aufgabe der Ausbildung oder Wechsel des Berufs, sonst ebenfalls aus wichtigem Grund.</td></tr>
<tr><th>Form</th><td><b>schriftlich</b>; nach der Probezeit mit Angabe der Kündigungsgründe (§ 22 Abs. 3)</td></tr>
<tr><th>Zusatz: Unterbrechung</th><td>Wird die Ausbildung in der Probezeit um <b>mehr als ein Drittel</b> der Probezeit unterbrochen (z. B. Krankheit), verlängert sich die Probezeit um diese Zeit. Kürzere Unterbrechungen verlängern nichts.</td></tr></tbody></table></div>

<h4>1.5 Jugendarbeitsschutzgesetz (005)</h4>
<p>Gilt für alle <b>unter 18-Jährigen</b> in Berufsausbildung oder Beschäftigung über zwei Monate außerhalb des Familienhaushalts. Ab 18 gilt das Arbeitszeitgesetz.</p>
<div class="scroll"><table class="tbl"><tbody>
<tr><th>Ärztliche Untersuchung</th><td><b>Erstuntersuchung</b> vor Beginn und <b>Nachuntersuchung nach einem Jahr</b> (§ 32 f.)</td></tr>
<tr><th>Arbeitszeit</th><td>täglich <b>8 Stunden</b> (ausnahmsweise 8,5), <b>40 Stunden</b> pro Woche, <b>5-Tage-Woche</b>. Samstags-, Sonntags-, Feiertags- und Nachtarbeit in IT-Betrieben i. d. R. nicht erlaubt.</td></tr>
<tr><th>Beschäftigungszeit</th><td>nur von <b>6 bis 20 Uhr</b>, in mehrschichtigen Betrieben bis 23 Uhr</td></tr>
<tr><th>Freizeit</th><td>nach der Arbeit mindestens <b>12 Stunden</b></td></tr>
<tr><th>Ruhepausen</th><td><b>30 Minuten</b> bei mehr als 4,5 bis 6 Stunden, <b>60 Minuten</b> bei mehr als 6 Stunden</td></tr>
<tr><th>Urlaub</th><td>unter 16 Jahren <b>30</b> Tage, unter 17 Jahren <b>27</b>, unter 18 Jahren <b>25</b>. Möglichst in den Berufsschulferien; ein Berufsschultag im Urlaub ist kein Urlaubstag.</td></tr>
<tr><th>Berufsschule</th><td>Freistellung, <b>ganztägig einmal pro Woche</b> bei mehr als 5 Unterrichtsstunden (8 Zeitstunden werden angerechnet); <b>am Tag vor der schriftlichen Prüfung</b> frei</td></tr>
<tr><th>Mehrarbeit</th><td>Ausgleich innerhalb der <b>folgenden drei Wochen</b></td></tr>
<tr><th>Ausnahmen</th><td>in Notfällen, wenn kein Ersatz möglich ist (§§ 21, 23)</td></tr>
<tr><th>Betreuung</th><td>Betriebsarzt bzw. Fachkraft für Arbeitssicherheit muss die Jugendlichen betreuen</td></tr></tbody></table></div>
<p><b>Kompetenzcheck, Lösung:</b></p>
<div class="scroll"><table class="tbl"><thead><tr><th>Aussage</th><th>Lösung</th></tr></thead><tbody>
<tr><td>a) Jugendliche müssen nur einmal zur ärztlichen Untersuchung.</td><td><b>Falsch</b> (Erst- und Nachuntersuchung nach 1 Jahr)</td></tr>
<tr><td>b) Eine Probezeit von fünf Monaten ist erlaubt.</td><td><b>Falsch</b> (höchstens 4)</td></tr>
<tr><td>c) In der Probezeit kann jeder mit einer Frist von 14 Tagen kündigen.</td><td><b>Falsch</b> (jederzeit ohne Frist)</td></tr>
<tr><td>d) Die Arbeits- bzw. Ausbildungszeit ist auf 40 Stunden/Woche festgeschrieben.</td><td><b>Richtig</b></td></tr>
<tr><td>e) Die normale Ausbildungszeit kann auch 8,5 Stunden = 42,5 Stunden/Woche betragen.</td><td><b>Falsch</b> (8,5 nur ausnahmsweise, Woche höchstens 40)</td></tr>
<tr><td>f) Für 6 Unterrichtsstunden Berufsschule können einmal pro Woche 8 Zeitstunden gerechnet werden.</td><td><b>Richtig</b></td></tr>
<tr><td>g) Bei einem 8-stündigen Ausbildungstag sind mindestens 30 Minuten Pause hinzuzurechnen.</td><td><b>Falsch</b> (mehr als 6 Stunden = 60 Minuten)</td></tr>
<tr><td>h) Jugendliche in IT-Betrieben können einen Tag pro Woche samstags, sonntags oder feiertags eingesetzt werden.</td><td><b>Falsch</b> (i. d. R. nicht erlaubt)</td></tr>
<tr><td>i) In Notfällen und ohne Alternativen gelten Ausnahmen.</td><td><b>Richtig</b></td></tr>
<tr><td>j) Mehrarbeit wird notiert und am Monatsende ausgeglichen.</td><td><b>Falsch</b> (innerhalb von drei Wochen)</td></tr>
<tr><td>k) Jugendliche müssen mindestens an einem von zwei Berufsschultagen anwesend sein.</td><td><b>Falsch</b> (Berufsschulpflicht besteht an allen Schultagen; freigestellt wird ganztägig nur einmal pro Woche)</td></tr>
<tr><td>l) Gibt es einen Betriebsarzt oder eine Sicherheitsfachkraft, muss er/sie sich besonders um Jugendliche kümmern.</td><td><b>Richtig</b></td></tr>
<tr><td>m) Urlaub nach betrieblichen Regeln, Familien haben in den Ferien Vorrang, Jugendliche außerhalb.</td><td><b>Falsch</b> (Urlaub soll in den Berufsschulferien liegen)</td></tr>
<tr><td>n) Ein 17-jähriger Azubi erhält 25 Urlaubstage, eine 16-jährige 30.</td><td><b>Falsch</b> (17-Jähriger: 25 stimmt, aber die 16-Jährige bekommt 27; 30 gibt es nur unter 16)</td></tr>
<tr><td>o) Azubis sind für Berufsschule und Prüfungen freizustellen, Jugendliche auch am Tag vor der Prüfung.</td><td><b>Richtig</b></td></tr></tbody></table></div>

<h4>1.6 Arbeitsrechte der Arbeitnehmer (006)</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>Gesetz / Prinzip</th><th>Kern</th></tr></thead><tbody>
<tr><td><b>Günstigkeitsprinzip</b></td><td>Einzelvertrag ist frei gestaltbar. Tarifvertrag und Betriebsvereinbarung gelten als kollektives Recht. Es gilt immer die für den Arbeitnehmer <b>günstigere</b> Regelung.</td></tr>
<tr><td><b>Arbeitszeitgesetz (ArbZG)</b></td><td>begrenzt tägliche Arbeitszeit, regelt Pausen und Ruhezeiten, gilt nicht für leitende Angestellte und Beamte</td></tr>
<tr><td><b>Teilzeit- und Befristungsgesetz (TzBfG)</b></td><td>Teilzeit und Befristung. Nach <b>mehr als 6 Monaten</b> kann man eine Verringerung der Arbeitszeit verlangen. Befristung braucht i. d. R. einen sachlichen Grund.</td></tr>
<tr><td><b>§ 622 BGB und KSchG</b></td><td>Kündigung schriftlich und fristgerecht. KSchG gilt bei <b>mehr als 10 Vollbeschäftigten</b> (Azubis zählen nicht, Teilzeit anteilig) und nach <b>6 Monaten</b> Betriebszugehörigkeit. Betriebsrat anhören.</td></tr>
<tr><td><b>AGG</b></td><td>verhindert Benachteiligung wegen Rasse/ethnischer Herkunft, Geschlecht, Religion/Weltanschauung, Behinderung, Alter, sexueller Identität (bei Einstellung, Umbesetzung, Kündigung)</td></tr>
<tr><td><b>Mindestlohngesetz (MiLoG)</b></td><td>Mindestlohnkommission legt den Mindestlohn fest, auch eine Mindestausbildungsvergütung gibt es</td></tr>
<tr><td><b>Entgeltfortzahlungsgesetz</b></td><td>bis zu <b>6 Wochen</b> Lohnfortzahlung bei unverschuldeter Krankheit, wenn man dem Betrieb <b>mehr als 5 Wochen</b> angehört (gilt auch für Azubis)</td></tr>
<tr><td><b>BEM</b> (SGB IX, früher § 84 Abs. 2)</td><td>Betriebliches Eingliederungsmanagement bei <b>mehr als 6 Wochen</b> Krankheit (ununterbrochen oder wiederholt) innerhalb eines Jahres: Prüfung, wie der Arbeitsplatz erhalten werden kann</td></tr>
<tr><td><b>Bundesurlaubsgesetz</b></td><td>mindestens <b>24 Werktage</b> (= 20 Arbeitstage bei 5-Tage-Woche). Resturlaub bis 31. März. Krankheitstage sind keine Urlaubstage.</td></tr>
<tr><td><b>Mutterschutzgesetz</b></td><td>besonderer Kündigungsschutz in Schwangerschaft und nach der Geburt. Schutzfrist <b>6 Wochen vor</b> und i. d. R. <b>8 Wochen nach</b> der Entbindung. Mutterschaftsgeld der Krankenkasse, Arbeitgeber stockt bis zum Nettogehalt auf.</td></tr>
<tr><td><b>BEEG</b> (Elternzeit)</td><td>Anspruch jedes Elternteils bis zur Vollendung des <b>3. Lebensjahres</b> des Kindes. Hauptpflichten ruhen, Rückkehranspruch. Elterngeld, ElterngeldPlus, Partnerbonus.</td></tr>
<tr><td><b>Schwerbehindertenrecht (SGB IX)</b></td><td>Arbeitgeber ab 20 Arbeitsplätzen müssen <b>5 %</b> mit Schwerbehinderten besetzen, sonst <b>Ausgleichsabgabe</b>. Zusatzurlaub, besonderer Kündigungsschutz.</td></tr>
<tr><td><b>Kurzarbeit</b></td><td>nicht einseitig anordenbar. Die Arbeitsagentur zahlt <b>67 % oder 60 %</b> des ausgefallenen pauschalierten Nettoentgelts (mit/ohne Kind).</td></tr>
<tr><td><b>Personalakte</b></td><td>Der Mitarbeiter darf sie <b>vollständig einsehen</b>. Zweifelhafte Unterlagen, mit denen er nicht rechnen kann, gehören nicht hinein. Falsches kann entfernt werden, Stellungnahmen können beigefügt werden. Schweigepflicht.</td></tr>
<tr><td><b>Aushangpflichtige Gesetze</b></td><td>müssen jederzeit zugänglich sein (auch im Intranet)</td></tr></tbody></table></div>
<p><b>Arbeitszeitgesetz, Merkzettel des Blattes:</b></p>
<div class="scroll"><table class="tbl"><tbody>
<tr><th>Werktägliche Arbeitszeit</th><td><b>8 Stunden</b></td></tr>
<tr><th>Maximale tägliche Arbeitszeit</th><td><b>10 Stunden</b> (bis 60 Std./Woche), wenn innerhalb von <b>6 Monaten</b> im Schnitt höchstens 8 Stunden täglich gearbeitet wird</td></tr>
<tr><th>Pause bei 8,5 Stunden</th><td><b>30 Minuten</b> (bei mehr als 6 bis 9 Stunden); bei mehr als 9 Stunden mindestens 45 Minuten. Eine Pause zählt erst ab 15 Minuten.</td></tr>
<tr><th>Mindest-Ruhezeit</th><td><b>11 Stunden</b> ununterbrochen zwischen Arbeitsende und -beginn (in Gaststätten, Hotels, Krankenhäusern um 1 Stunde verkürzbar)</td></tr>
<tr><th>Sonntagsarbeit</th><td>grundsätzlich <b>verboten</b>, Ausnahmen z. B. in Krankenhäusern, Gaststätten, Verkehr, mit Ersatzruhetag (Zusatz, steht nicht auf dem Blatt)</td></tr></tbody></table></div>` });

<h4>2.1 Beendigung von Arbeitsverhältnissen (Schaubild des Blattes)</h4>
<p>Ein Arbeitsverhältnis endet durch <b>Aufhebungsvertrag</b>, durch <b>Fristablauf</b> (Befristung) oder durch <b>Kündigung</b>.</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Kündigungsart</th><th>Merkmale</th></tr></thead><tbody>
<tr><td><b>Ordentliche Kündigung</b></td><td>ohne Angabe von Gründen nötig (wenn kein Kündigungsschutz), mit <b>gesetzlichen Kündigungsfristen</b></td></tr>
<tr><td><b>Außerordentliche Kündigung</b> (§ 626 BGB)</td><td>„fristlose Kündigung“, sofort wirksam, nur aus <b>wichtigem Grund</b>, innerhalb von <b>2 Wochen</b> ab Kenntnis der Tatsachen</td></tr>
<tr><td><b>Änderungskündigung</b> (§ 2 KSchG)</td><td>Kündigung des Arbeitsvertrags <b>plus</b> Angebot eines neuen Vertrags mit geänderten Bedingungen. Der Arbeitnehmer kann das Angebot <b>unter Vorbehalt</b> annehmen und die Änderung gerichtlich prüfen lassen.</td></tr></tbody></table></div>
<p><b>Form:</b> Schriftform ist zwingend (§ 623 BGB), die <b>elektronische Form ist ausgeschlossen</b> (also keine E-Mail, kein WhatsApp). Das gilt auch für den Aufhebungsvertrag.</p>

<h4>2.3 Gesetzliche Grundlagen (Blatt „Kündigungen“, Abschnitte 5 und 6)</h4>
<div class="scroll"><table class="tbl"><thead><tr><th>Norm</th><th>Inhalt</th></tr></thead><tbody>

<tr><td><b>§ 38 SGB III</b></td><td>Wer vom Ende des Arbeits- oder Ausbildungsverhältnisses weiß, muss sich <b>spätestens 3 Monate vorher</b> bei der Agentur für Arbeit <b>arbeitsuchend melden</b>. Liegen weniger als 3 Monate zwischen Kenntnis und Ende: <b>innerhalb von 3 Tagen</b>.</td></tr></tbody></table></div>

<h4>2.5 Aufgabe: Abmahnung</h4>
<div class="box"><b>Funktionen der Abmahnung:</b> <b>Rüge</b> (das Fehlverhalten wird beanstandet) · <b>Dokumentation/Hinweis</b> (die Pflichtverletzung wird konkret festgehalten) · <b>Warnung</b> (bei Wiederholung drohen arbeitsrechtliche Folgen bis zur Kündigung). Ohne Abmahnung ist eine verhaltensbedingte Kündigung meist unwirksam.</div>

<h4>2.6 Rechtmäßigkeit von Kündigungen: die vier Fälle</h4>
<p>Prüfreihenfolge: Form (§ 623) · Betriebsrat (§ 102 BetrVG) · Frist (§ 622) · Sonderkündigungsschutz · gilt das KSchG (§ 1: mehr als 6 Monate)? · wenn ja: Grund nach § 1 Abs. 2.</p>

<p><b>Weitere Fallfragen, Lösung:</b></p>
<p><b>2) Einmonatige Probezeit nur vergütet, wenn ein endgültiger Vertrag zustande kommt. Rechtens?</b> <b>Nein.</b> Die Probezeit ist <b>Teil des Arbeitsverhältnisses</b>, nicht ein Vorspiel. Für geleistete Arbeit besteht <b>Anspruch auf Vergütung</b> (§ 611a BGB), mindestens in Höhe des Mindestlohns (MiLoG). Eine Abrede, die die Vergütung vom späteren Vertragsabschluss abhängig macht, ist <b>unwirksam</b>.</p>
<p><b>3) Chiara ist im 3. Monat der Probezeit zwei Wochen krank, der Chef will die Probezeit um zwei Wochen verlängern. Rechtens?</b> <b>Nein.</b> Die Probezeit endet mit der vereinbarten Dauer (höchstens 6 Monate, § 622 Abs. 3 BGB). Krankheit verlängert sie <b>nicht automatisch</b>; eine Verlängerung geht nur im gegenseitigen Einvernehmen und insgesamt höchstens bis 6 Monate. <b>Zusatz:</b> Wäre Chiara <b>Auszubildende</b>, verlängert sich die Probezeit nur, wenn die Unterbrechung mehr als ein Drittel der Probezeit beträgt (§ 20 BBiG). Zwei Wochen sind bei einer 4-monatigen Probezeit weniger als ein Drittel, also keine Verlängerung.</p>

<h4>2.7 Arbeitsgerichtsbarkeit</h4>
<p><b>Aufbau</b> (eigenständig, unabhängig von der Zivilgerichtsbarkeit, drei Instanzen):</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Instanz</th><th>Gericht</th><th>Spruchkörper</th><th>Rechtsmittel dorthin</th></tr></thead><tbody>
<tr><td>1.</td><td><b>Arbeitsgericht</b></td><td><b>Kammer</b>: 1 Berufsrichter + je 1 ehrenamtlicher Richter von Arbeitgeber- und Arbeitnehmerseite</td><td>–</td></tr>
<tr><td>2.</td><td><b>Landesarbeitsgericht</b></td><td><b>Kammer</b> (wie oben)</td><td><b>Berufung</b> und <b>Beschwerde</b></td></tr>
<tr><td>3.</td><td><b>Bundesarbeitsgericht</b> (höchste Instanz, einer der fünf obersten Gerichtshöfe des Bundes)</td><td><b>Senat</b>: 3 Berufsrichter (Vorsitzender + 2 Beisitzer) + 2 ehrenamtliche Richter</td><td><b>Revision</b> und <b>Rechtsbeschwerde</b></td></tr></tbody></table></div>
<div class="scroll"><table class="tbl"><thead><tr><th>Urteilsverfahren</th><th>Beschlussverfahren</th></tr></thead><tbody><tr>
<td>Parteien müssen die entscheidungserheblichen <b>Tatsachen selbst vortragen</b> und beweisen (wie im Zivilprozess). Es geht um Ansprüche und Streitfragen aus einem bestehenden Arbeitsverhältnis, auch um Zustandekommen und Beendigung.</td>
<td>Das Gericht <b>ermittelt den Sachverhalt von Amts wegen</b> (<b>Amtsermittlung</b>). Richtig u. a. für Angelegenheiten aus dem <b>Betriebsverfassungsgesetz</b>, Sprecherausschussgesetz und den Mitbestimmungsgesetzen.</td></tr></tbody></table></div>
<p><b>Typische Streitfälle:</b> Kündigungsschutzklage, Wirksamkeit einer Befristung, Anfechtung eines Aufhebungsvertrags · Lohn, Gehalt, Gratifikationen · Urlaub und Urlaubsgeld · Zeugniserteilung und -berichtigung · Arbeitspapiere · Entfernung von Abmahnungen, Betriebsrente · Wettbewerbsverbote.</p>
<p><b>Ablauf:</b> Wenige Wochen nach der Klage folgt im Urteilsverfahren eine <b>Güteverhandlung</b>, bei der <b>nur der Berufsrichter</b> anwesend ist. Ziel: Beschleunigung und eine <b>gütliche Einigung</b>. Gelingt sie nicht, folgt die <b>Kammerverhandlung</b> mit den ehrenamtlichen Richtern, die <b>gleiches Stimmrecht</b> haben. Das Gericht soll im ganzen Verfahren auf eine Einigung hinwirken.</p>
<p><b>Berufung zum Landesarbeitsgericht</b> ist möglich, wenn das Arbeitsgericht sie zugelassen hat (z. B. grundsätzliche Bedeutung), wenn die unterlegene Partei um <b>mehr als 600 Euro</b> beschwert ist oder bei Streit über das Bestehen, Nichtbestehen oder die <b>Kündigung</b> eines Arbeitsverhältnisses. Beim Beschlussverfahren geht <b>Beschwerde</b> ohne weitere Voraussetzungen. Das LAG verhandelt <b>neu in tatsächlicher und rechtlicher Hinsicht</b>, neue Tatsachen sind mit Einschränkungen möglich.</p>
<p><b>Revision / Rechtsbeschwerde zum BAG</b> nur, wenn das LAG sie <b>zugelassen</b> hat (z. B. grundsätzliche Bedeutung). Sonst <b>Nichtzulassungsbeschwerde</b> beim BAG. Das BAG prüft <b>nur auf Rechtsfehler</b>, auf Grundlage des vom LAG festgestellten Sachverhalts, <b>keine neuen Tatsachen</b> (wenige Ausnahmen). Reicht der Sachverhalt nicht aus, wird das Urteil aufgehoben und an das LAG <b>zurückverwiesen</b>. Weitere Aufgaben des BAG: <b>Einheitlichkeit der Rechtsprechung</b> wahren und das <b>Recht fortbilden</b> (z. B. Arbeitskampfrecht).</p>
<p><b>Prozessvertretung:</b> vor dem Arbeitsgericht selbst, durch einen Rechtsanwalt, Verbandsvertreter (Arbeitgeberverband, Gewerkschaft) oder sonstigen Bevollmächtigten. <b>Vor dem LAG und BAG Vertretungszwang</b> durch Rechtsanwalt oder Verbands-/Gewerkschaftsvertreter.</p>
<p><b>Aufgaben des Blattes, Lösung:</b> 1 b · 2 c · 3 a · 4 b · 5 b · 6 b · 7 c · 8 b · 9 c · 10 b</p>` });

<li>Die Höhe wird zwischen Betrieb und Azubi <b>individuell vereinbart</b>, wenn kein Tarifvertrag oder keine Betriebsvereinbarung gilt. Sie muss Gesetzen und dem Grundgesetz entsprechen.</li>
<li><b>§ 17 BBiG:</b> Die Vergütung muss <b>angemessen</b> sein und <b>mindestens jährlich ansteigen</b>. <b>Mehrarbeit</b> ist besonders zu vergüten.</li>
<li><b>Mindestausbildungsvergütung</b> (Recherche-Aufgabe des Blattes): Das Blatt nennt <b>620 €</b> für das 1. Jahr bis 2023. Für einen <b>Ausbildungsbeginn 2026</b> gilt: 1. Jahr <b>724 €</b>, 2. Jahr <b>854 €</b>, 3. Jahr <b>977 €</b>, 4. Jahr <b>1.014 €</b> pro Monat. IT-Berufe liegen i. d. R. deutlich darüber.</li>
<li>Abgezogen werden <b>Lohn-, Kirchensteuer und Soli</b> (nur wenn Freigrenzen überschritten sind bzw. bei Kirchenzugehörigkeit) sowie <b>Kranken-, Pflege-, Renten-, Arbeitslosenversicherung</b>. Der Arbeitgeber beteiligt sich anteilig und überweist alles. Die <b>Unfallversicherung</b> bei der Berufsgenossenschaft trägt der <b>Betrieb allein</b>.</li>
<li>Die Sozialleistungsträger sind <b>Körperschaften des öffentlichen Rechts mit Selbstverwaltung</b> (SGB III und IV), keine staatlichen Einrichtungen. Der Mitarbeiter muss dem Arbeitgeber seine Krankenkasse und seine Rentenversicherung mitteilen.</li>
<li><b>Teilzeitausbildung (§ 8 BBiG):</b> mit Begründung möglich, v. a. für <b>Alleinerziehende, junge Eltern</b> oder bei Pflege in der Familie. Gesamtzeit (Schule + Betrieb) <b>20 bis 30 Wochenstunden</b>. Unter 25 Wochenstunden kann man wählen, ob sich die Ausbildung verlängert. Antrag <b>gemeinsam mit dem Ausbildenden bei der IHK</b>. Hilfen: <b>Berufsausbildungsbeihilfe</b> (Agentur für Arbeit), Kindergeld (Familienkasse).</li></ul>

<h4>3.3 Zusammensetzung der Lohn- und Gehaltsabrechnung</h4>
<p>Der Arbeitgeber muss <b>monatlich eine Abrechnung ausstellen</b> (§ 108 GewO). Sie ist ein wichtiges steuerrechtliches Dokument und muss korrekt sein. Aufbewahrung in der Regel <b>6 Jahre</b> (§ 41 EStG).</p>
<div class="box"><b>Vorgehen in 5 Schritten:</b> 1. Bruttogehalt notieren · 2. Steuern und Sozialversicherungsbeiträge berechnen · 3. Nettogehalt ermitteln · 4. weitere Abzüge und Zuschüsse berechnen · 5. Auszahlungsbetrag ermitteln</div>

<tr><td>1</td><td><b>Daten des Arbeitnehmers:</b> Name, Geburtsdatum, Datum des Beschäftigungsbeginns</td></tr>
<tr><td>2</td><td><b>Steuerklasse, Steuer-ID, Steuerfreibeträge</b>, Sozialversicherungsnummer, Abrechnungszeitraum</td></tr>
<tr><td>3</td><td><b>Anschrift</b> des Arbeitgebers und Arbeitnehmers</td></tr>
<tr><td>4</td><td><b>Bruttoverdienst</b> (u. a. Weihnachtsgeld, Urlaubsgeld, VL, Abfindungen, Leistungsprämie, Überstundenzuschläge)</td></tr>
<tr><td>5</td><td><b>Steuer- und Sozialversicherungsbeiträge</b></td></tr>
<tr><td>6</td><td><b>Nettoverdienst</b></td></tr>
<tr><td>7</td><td><b>Abzüge und Zuschüsse zum Nettoverdienst</b> (z. B. Arbeitgeberzuschuss zur freiwilligen Krankenversicherung)</td></tr>
<tr><td>8</td><td><b>Auszahlungsbetrag</b></td></tr>
<tr><td>9</td><td><b>Abgelaufene Jahreswerte</b> (alle Brutto-Beträge und Abzüge im laufenden Abrechnungsjahr bisher)</td></tr></tbody></table></div>

{ t: 'Berufsausbildung', q: 'Urlaub, Mutterschutz, Elternzeit: Eckdaten?', a: 'BUrlG: mindestens 24 Werktage (20 Arbeitstage bei 5-Tage-Woche). Mutterschutz: 6 Wochen vor, 8 Wochen nach der Geburt, besonderer Kündigungsschutz. Elternzeit: bis zum 3. Geburtstag, Rückkehranspruch.' },
{ t: 'Berufsausbildung', q: 'Schwerbehinderung, Kurzarbeit, Personalakte: Kernaussagen?', a: 'Ab 20 Arbeitsplätzen 5 % Schwerbehinderte, sonst Ausgleichsabgabe; besonderer Kündigungsschutz. Kurzarbeit: Arbeitsagentur zahlt 67 % bzw. 60 % des Netto, nicht einseitig anordenbar. Personalakte: Mitarbeiter darf alles einsehen, Falsches muss entfernt werden.' },
/* --- Kündigung --- */
{ t: 'Kündigung', q: 'Wie kann ein Arbeitsverhältnis enden?', a: 'Durch Aufhebungsvertrag, Fristablauf (Befristung) oder Kündigung (ordentlich, außerordentlich, Änderungskündigung).' },
{ t: 'Kündigung', q: 'Ordentliche und außerordentliche Kündigung?', a: 'Ordentlich: mit gesetzlicher Frist. Außerordentlich (§ 626 BGB): fristlos, sofort wirksam, nur aus wichtigem Grund, binnen 2 Wochen ab Kenntnis der Tatsachen.' },
{ t: 'Kündigung', q: 'Was ist eine Änderungskündigung (§ 2 KSchG)?', a: 'Kündigung mit gleichzeitigem Angebot zu geänderten Bedingungen. Der Arbeitnehmer kann es unter Vorbehalt annehmen und die Änderung gerichtlich prüfen lassen.' },
{ t: 'Kündigung', q: 'Welche Form braucht eine Kündigung (§ 623 BGB)?', a: 'Schriftform, elektronische Form ausgeschlossen (keine E-Mail, kein WhatsApp). Gilt auch für den Aufhebungsvertrag.' },
{ t: 'Kündigung', q: 'Allgemeiner und besonderer Kündigungsschutz?', a: 'Allgemein (§ 1 KSchG): nach mehr als 6 Monaten (und mehr als 10 Beschäftigten) nur bei sozialer Rechtfertigung. Besonders: Betriebsratsmitglieder, Schwerbehinderte, werdende Mütter, Auszubildende, Datenschutzbeauftragte.' },
{ t: 'Kündigung', q: 'Die drei Kündigungsgründe nach § 1 Abs. 2 KSchG?', a: 'Personenbedingt (z. B. dauerhafte Krankheit), verhaltensbedingt (Pflichtverletzung, Voraussetzung Abmahnung), betriebsbedingt (dringende betriebliche Erfordernisse, Voraussetzung Sozialauswahl).' },
{ t: 'Kündigung', q: 'Gesetzliche Kündigungsfristen nach § 622 BGB?', a: 'Grundfrist 4 Wochen zum 15. oder Monatsende. Probezeit (höchstens 6 Monate): 2 Wochen. Bei Kündigung durch den Arbeitgeber nach 2 / 5 / 8 / 10 / 12 / 15 / 20 Jahren: 1 / 2 / 3 / 4 / 5 / 6 / 7 Monate zum Monatsende.' },
{ t: 'Kündigung', q: 'Gilt die verlängerte Frist auch für die Kündigung durch den Arbeitnehmer?', a: 'Nein, für den Arbeitnehmer bleibt es bei 4 Wochen (sofern der Vertrag nichts anderes regelt).' },
{ t: 'Kündigung', q: 'Betriebsrat und Kündigung (§ 102 BetrVG)?', a: 'Der Betriebsrat ist vor jeder Kündigung zu hören, sonst ist sie unwirksam. Er kann einer ordentlichen Kündigung widersprechen (z. B. soziale Gesichtspunkte nicht berücksichtigt, Weiterbeschäftigung möglich).' },
{ t: 'Kündigung', q: 'Arbeitsuchend melden (§ 38 SGB III)?', a: 'Spätestens 3 Monate vor dem Ende des Arbeits- oder Ausbildungsverhältnisses. Wer weniger als 3 Monate vorher davon erfährt: innerhalb von 3 Tagen.' },
{ t: 'Kündigung', q: 'Wie funktioniert die Sozialauswahl?', a: 'Gekündigt wird, wen es am wenigsten hart trifft. Kriterien: Lebensalter, Betriebszugehörigkeit, Unterhaltspflichten, Schwerbehinderung. Nach Punkteschema: wer die niedrigste Punktzahl hat, wird gekündigt.' },
{ t: 'Kündigung', q: 'Punkteschema (JIKU): Alter und Betriebszugehörigkeit?', a: 'Alter: 1 Punkt je Lebensjahr, max. 55. Betriebszugehörigkeit: bis 10 Jahre 1 Punkt je Jahr, ab dem 11. Jahr 2 Punkte, max. 70, nur Zeiten bis zum 55. Lebensjahr.' },
{ t: 'Kündigung', q: 'Punkteschema (JIKU): Unterhalt und Schwerbehinderung?', a: 'Je Kind 4 Punkte, verheiratet 8 Punkte. Schwerbehinderung bis 50 %: 5 Punkte, darüber je 10 % Erwerbsminderung 1 Punkt.' },
{ t: 'Kündigung', q: 'Sozialauswahl: 44 Jahre, 17 Jahre im Betrieb, verheiratet, 2 Kinder?', a: 'Alter 44 + Betriebszugehörigkeit (10 + 7 · 2 = 24) + Unterhalt (8 + 2 · 4 = 16) = 84 Punkte.' },
{ t: 'Kündigung', q: 'Funktionen und Bestandteile einer Abmahnung?', a: 'Rüge-, Dokumentations- und Warnfunktion. Inhalt: genaue Beschreibung des Fehlverhaltens (Datum, Uhrzeit), verletzte Pflicht, Aufforderung zu Verhaltensänderung, Androhung der Kündigung, Personalakte, Unterschrift.' },
{ t: 'Kündigung', q: 'Wann ist eine verhaltensbedingte Kündigung meist unwirksam?', a: 'Wenn der Arbeitnehmer vorher nicht (einschlägig) abgemahnt wurde. Ausnahme: sehr schwere Pflichtverletzung.' },
{ t: 'Kündigung', q: 'Prüfschema: Ist eine Kündigung rechtmäßig?', a: 'Schriftform · Betriebsrat angehört · Frist richtig · Sonderkündigungsschutz? · gilt das KSchG (über 6 Monate)? · Grund (Person, Verhalten, Betrieb), Abmahnung bzw. Sozialauswahl.' },
{ t: 'Kündigung', q: 'Kündigung in den ersten 6 Monaten (kein KSchG): Was gilt?', a: 'Kein allgemeiner Kündigungsschutz, es braucht keinen Grund. Form, Frist (in der Probezeit 2 Wochen), Betriebsrat und Sonderkündigungsschutz gelten aber weiter.' },
{ t: 'Kündigung', q: 'Dauerhaft kranke Mitarbeiterin (keine Besserung): Kündigungsgrund?', a: 'Personenbedingt. Möglich bei negativer Gesundheitsprognose und erheblicher Betriebsbelastung, nach Interessenabwägung (und BEM).' },
{ t: 'Kündigung', q: 'Mitarbeiter hat Probleme mit der Digitalisierung, gute Leistung, 28 Jahre im Betrieb: Kündigung?', a: 'Eher unwirksam: personenbedingt, mildere Mittel (Schulung) nicht ausgeschöpft, lange Betriebszugehörigkeit. Frist wäre 7 Monate zum Monatsende.' },
{ t: 'Kündigung', q: 'Neue Mitarbeiterin (5 Monate), sehr gute Leistungen, wird gekündigt: zulässig?', a: 'Rechtlich ja: KSchG gilt erst nach 6 Monaten, kein Grund nötig. Form, Frist und Betriebsrat müssen stimmen, keine Diskriminierung (AGG).' },
{ t: 'Kündigung', q: 'Probezeit ohne Vergütung, wenn kein endgültiger Vertrag kommt: erlaubt?', a: 'Nein. Die Probezeit ist Teil des Arbeitsverhältnisses, die geleistete Arbeit muss vergütet werden (mindestens Mindestlohn). Die Abrede ist unwirksam.' },
{ t: 'Kündigung', q: 'Krankheit in der Probezeit: Verlängert sie die Probezeit?', a: 'Nein, nicht automatisch. Verlängerung nur im Einvernehmen, insgesamt höchstens 6 Monate. Bei Azubis nur, wenn die Unterbrechung mehr als ein Drittel der Probezeit ausmacht (§ 20 BBiG).' },
/* --- Arbeitsgericht --- */
{ t: 'Arbeitsgericht', q: 'Aufbau der Arbeitsgerichtsbarkeit?', a: 'Drei Instanzen: Arbeitsgericht → Landesarbeitsgericht (Berufung/Beschwerde) → Bundesarbeitsgericht (Revision/Rechtsbeschwerde). Eigenständig neben der Zivilgerichtsbarkeit.' },
{ t: 'Arbeitsgericht', q: 'Besetzung der Gerichte?', a: 'Arbeits- und Landesarbeitsgericht: Kammer mit 1 Berufsrichter + je 1 ehrenamtlichem Richter (Arbeitgeber/Arbeitnehmer). Bundesarbeitsgericht: Senat mit 3 Berufsrichtern + 2 ehrenamtlichen Richtern.' },
{ t: 'Arbeitsgericht', q: 'Urteilsverfahren und Beschlussverfahren?', a: 'Urteilsverfahren: Parteien tragen Tatsachen selbst vor (Ansprüche aus dem Arbeitsverhältnis). Beschlussverfahren: Amtsermittlung durch das Gericht, v. a. Betriebsverfassungsrecht.' },
{ t: 'Arbeitsgericht', q: 'Ablauf der ersten Instanz im Urteilsverfahren?', a: 'Güteverhandlung wenige Wochen nach der Klage (nur Berufsrichter, Ziel gütliche Einigung, Beschleunigung). Scheitert sie: Kammerverhandlung mit ehrenamtlichen Richtern, die gleiches Stimmrecht haben.' },
{ t: 'Arbeitsgericht', q: 'Wann ist Berufung zum Landesarbeitsgericht möglich?', a: 'Wenn das Arbeitsgericht sie zugelassen hat, oder bei Beschwer über 600 €, oder bei Streit über Bestehen/Nichtbestehen/Kündigung eines Arbeitsverhältnisses.' },
{ t: 'Arbeitsgericht', q: 'Wann gibt es Revision zum BAG?', a: 'Nur wenn das LAG sie zugelassen hat (z. B. grundsätzliche Bedeutung). Sonst Nichtzulassungsbeschwerde beim BAG. Rechtsbeschwerde bei Beschlüssen unter denselben Voraussetzungen.' },
{ t: 'Arbeitsgericht', q: 'Was prüft das Bundesarbeitsgericht?', a: 'Nur Rechtsfehler des LAG, auf Grundlage des festgestellten Sachverhalts, ohne neue Tatsachen. Bei unzureichendem Sachverhalt: Aufhebung und Zurückverweisung an das LAG.' },
{ t: 'Arbeitsgericht', q: 'Weitere Aufgaben des Bundesarbeitsgerichts?', a: 'Einheitlichkeit der Rechtsprechung wahren, Recht fortbilden (z. B. Arbeitskampfrecht), neben Gerechtigkeit im Einzelfall.' },
{ t: 'Arbeitsgericht', q: 'Wer darf vor Gericht vertreten?', a: 'Arbeitsgericht: Partei selbst, Rechtsanwalt, Verbands-/Gewerkschaftsvertreter, sonstiger Bevollmächtigter. LAG und BAG: Vertretungszwang durch Rechtsanwalt oder Verbands-/Gewerkschaftsvertreter.' },
{ t: 'Arbeitsgericht', q: 'Typische Streitfälle vor dem Arbeitsgericht?', a: 'Kündigungsschutzklage, Befristung, Aufhebungsvertrag, Lohn und Gehalt, Urlaub, Zeugnis, Arbeitspapiere, Entfernung von Abmahnungen, Betriebsrente, Wettbewerbsverbot.' },
/* --- Entgelt --- */
{ t: 'Entgelt', q: 'Die fünf Entgeltformen (Schaubild)?', a: 'Zeitentgelt · Leistungsentgelt · Zulagen · Beteiligungen · Zusatzleistungen.' },
{ t: 'Entgelt', q: 'Zeitentgelt: Lohn und Gehalt?', a: 'Lohn für Arbeiter nach geleisteten Stunden. Gehalt für Angestellte für einen Zeitraum, z. B. einen Monat.' },
{ t: 'Entgelt', q: 'Leistungsentgelt: drei Unterformen?', a: 'Akkordlohn (Stückakkord, Zeitakkord) · Provision (Umsatz-, Abschlussprovision) · Prämien (Qualitäts-, Einspar-, Anerkennungsprämie).' },
{ t: 'Entgelt', q: 'Zulagen: Beispiele?', a: 'Erschwernis-, Sonntags-, Feiertags-, Nachtzulagen · Leistungszulagen · Funktionszulagen (z. B. Sicherheitsbeauftragter) · Sozialzulagen (Familien-, Kinder-, Orts-, Haushaltszulagen).' },
{ t: 'Entgelt', q: 'Beteiligungen und Zusatzleistungen?', a: 'Beteiligungen: Umsatz-/Gewinnbeteiligung, Kapitalbeteiligung (Aktienoptionen). Zusatzleistungen: vermögenswirksame Leistungen, betriebliche Altersvorsorge, Sachbezüge (Firmenwagen, Arbeitskleidung, Betriebsverpflegung, Werkswohnung).' },
{ t: 'Entgelt', q: 'Mindestausbildungsvergütung (Beginn 2026)?', a: '1. Jahr 724 €, 2. Jahr 854 €, 3. Jahr 977 €, 4. Jahr 1.014 €. Nach § 17 BBiG muss die Vergütung angemessen sein und jährlich steigen, Mehrarbeit ist besonders zu vergüten.' },
{ t: 'Entgelt', q: 'Teilzeitausbildung (§ 8 BBiG)?', a: 'Mit Begründung (z. B. Alleinerziehende, junge Eltern, Pflege). 20 bis 30 Wochenstunden inkl. Schule. Antrag mit dem Ausbildenden bei der IHK. Hilfen: Berufsausbildungsbeihilfe, Kindergeld.' },
{ t: 'Entgelt', q: 'Was ist VL und wie wird sie abgerechnet?', a: 'Vermögenswirksame Leistungen (z. B. Bausparvertrag). Der Arbeitgeberzuschuss wird zum Brutto addiert, die Überweisung wird vom Netto abgezogen und direkt an Bank/Versicherung gezahlt.' },
/* --- Abrechnung --- */
{ t: 'Abrechnung', q: 'Die 5 Schritte der Gehaltsabrechnung?', a: '1. Brutto notieren · 2. Steuern und SV-Beiträge berechnen · 3. Netto ermitteln · 4. weitere Abzüge und Zuschüsse · 5. Auszahlungsbetrag.' },
{ t: 'Abrechnung', q: 'Was muss der Arbeitgeber zur Abrechnung beachten?', a: 'Monatlich ausstellen, korrekt nach § 108 GewO, 6 Jahre aufbewahren (§ 41 EStG).' },
{ t: 'Abrechnung', q: 'Unterschied Brutto gesamt, gesetzliches Netto, Auszahlungsbetrag?', a: 'Brutto gesamt = Gehalt + AG-Zuschuss VL. Gesetzliches Netto = Brutto − Steuern − SV. Auszahlungsbetrag = gesetzliches Netto − VL-Überweisung (und weitere Abzüge).' },
{ t: 'Abrechnung', q: 'Die sechs Steuerklassen?', a: '1 ledig · 2 alleinerziehend · 3 verheiratet, höheres Gehalt · 4 verheiratet, ähnliches Gehalt · 5 verheiratet, niedrigeres Gehalt · 6 Neben- und Zweitjob.' },
{ t: 'Abrechnung', q: 'Freibeträge nach Steuerklasse (2026)?', a: '1 und 4: 12.348 € · 2: 12.348 € + 4.260 € Entlastungsbetrag · 3: 24.696 € · 5 und 6: kein Grundfreibetrag.' },
{ t: 'Abrechnung', q: 'Kirchensteuer: Satz und Basis?', a: '9 % der Lohnsteuer (NRW), 8 % in Bayern/Baden-Württemberg, nur für Kirchenmitglieder. Wird abgerundet.' },
{ t: 'Abrechnung', q: 'Solidaritätszuschlag: Satz und wer zahlt?', a: '5,5 % der Lohn-/Einkommensteuer. Seit 2021 nur Hochverdiener (laut Blatt ab 1.461 € Lohnsteuer monatlich, Klasse 1 ab 6.647 € Gehalt). Für Azubis 0.' },
{ t: 'Abrechnung', q: 'SV-Sätze laut Arbeitsblatt (2024), Arbeitnehmeranteil?', a: 'KV 7,3 % + ½ Zusatzbeitrag (Ø 1,7 % → 0,85 %) = 8,15 % · PV 1,7 % (kinderlos + 0,6 % = 2,3 %) · RV 9,3 % · AV 1,2 % laut Tabelle (die Musterlösung rechnet mit 1,3 %).' },
{ t: 'Abrechnung', q: 'SV-Sätze 2026, Arbeitnehmeranteil?', a: 'KV 7,3 % + ½ Zusatzbeitrag (Ø 2,9 % → 1,45 %) = 8,75 % · PV 1,8 % (kinderlos 2,4 %) · RV 9,3 % · AV 1,3 %.' },
{ t: 'Abrechnung', q: 'Wer trägt den Kinderlosenzuschlag und die Unfallversicherung?', a: 'Den Zuschlag für Kinderlose (0,6 % Pflege) trägt der Arbeitnehmer allein. Die Unfallversicherung (Berufsgenossenschaft) trägt der Arbeitgeber allein.' },
{ t: 'Abrechnung', q: 'Beitragsbemessungsgrenzen 2026 (monatlich)?', a: 'Kranken- und Pflegeversicherung 5.812,50 €, Renten- und Arbeitslosenversicherung 8.450 €. Auf den Betrag darüber werden keine Beiträge erhoben.' },
{ t: 'Abrechnung', q: 'Wie rundet man in der Abrechnung?', a: 'SV-Beiträge auf Cent kaufmännisch. Kirchensteuer und Soli werden abgerundet.' },
{ t: 'Abrechnung', q: 'Rechnung: 2.327 € brutto gesamt, Lohnsteuer 172,41 €, KiSt, SV (Blatt). Netto und Auszahlung bei 27 € VL?', a: 'KiSt 15,51 · KV 189,65 · PV 53,52 · RV 216,41 · AV 30,25 (mit 1,3 %). Gesetzliches Netto 1.649,25 €, Auszahlungsbetrag 1.622,25 €.' },
{ t: 'Abrechnung', q: 'Aufbau der Abrechnung (Bereiche 1 bis 9)?', a: 'Daten AN · Steuerklasse/Steuer-ID/SV-Nr. · Anschriften · Bruttoverdienst · Steuer und SV · Nettoverdienst · Abzüge/Zuschüsse zum Netto · Auszahlungsbetrag · Jahreswerte.' }
];
